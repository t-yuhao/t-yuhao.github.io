<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>五子棋 · 增强版</title>
    <style>
        /* 完全复制之前的样式，此处省略以节省篇幅，实际使用时保留完整样式 */
        /* 为保持代码可运行，这里使用与原代码完全相同的样式，仅占位 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "华文楷体", "KaiTi", "Microsoft YaHei", "PingFang SC", serif;
            background: #ede6db;
            background-image: radial-gradient(ellipse at 20% 30%, rgba(180, 160, 140, 0.20) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(180, 160, 140, 0.20) 0%, transparent 60%),
                url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='120' height='120' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
            padding: 20px;
        }
        .container {
            max-width: 760px;
            width: 100%;
            background: rgba(252, 248, 242, 0.60);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 56px;
            box-shadow: 0 25px 60px rgba(80, 60, 40, 0.28), 0 0 0 1px rgba(220, 200, 180, 0.30) inset;
            padding: 32px;
            position: relative;
            overflow: hidden;
        }
        .container::before,
        .container::after {
            content: '';
            position: absolute;
            pointer-events: none;
            opacity: 0.06;
            z-index: 0;
            border-radius: 50%;
            background: radial-gradient(ellipse, #7a6a5a 0%, transparent 70%);
        }
        .container::before {
            width: 260px;
            height: 160px;
            bottom: -20px;
            left: -60px;
            transform: rotate(-6deg);
        }
        .container::after {
            width: 300px;
            height: 180px;
            top: -30px;
            right: -70px;
            transform: rotate(10deg);
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(60, 40, 20, 0.18);
            z-index: 1;
            overflow: hidden;
            background: #e8d5b5;
        }
        #boardCanvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 28px;
            background: #e8d5b5;
            cursor: pointer;
            touch-action: none;
            box-shadow: 0 0 0 1px rgba(120, 90, 60, 0.12) inset;
        }
        .float-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            background: rgba(20, 16, 12, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }
        .float-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .float-box {
            background: rgba(30, 25, 20, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 32px 48px;
            border-radius: 48px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 0, 0.15) inset;
            transform: scale(0.92) translateY(12px);
            transition: transform 0.40s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.40s ease;
            opacity: 0;
            min-width: 180px;
        }
        .float-overlay.show .float-box {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .float-box .title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 4px;
            font-family: "华文楷体", "KaiTi", serif;
            margin-bottom: 6px;
        }
        .float-box .sub {
            font-size: 18px;
            color: #c8c0b8;
            letter-spacing: 2px;
        }
        .float-box.win .title {
            color: #f5d742;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.25);
        }
        .float-box.lose .title {
            color: #e8836b;
            text-shadow: 0 0 30px rgba(232, 131, 107, 0.20);
        }
        .float-box.draw .title {
            color: #b0b8b0;
            text-shadow: 0 0 20px rgba(180, 180, 180, 0.15);
        }
        .float-box .btn-close-float {
            margin-top: 16px;
            padding: 6px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.20);
            background: rgba(255, 255, 255, 0.06);
            color: #ddd8d0;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.25s;
            letter-spacing: 2px;
        }
        .float-box .btn-close-float:hover {
            background: rgba(255, 255, 255, 0.14);
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            padding: 0 4px;
            z-index: 1;
            position: relative;
            flex-wrap: wrap;
            gap: 12px;
        }
        .status {
            background: rgba(248, 242, 234, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 6px 20px;
            border-radius: 40px;
            box-shadow: 0 0 0 1px rgba(180, 150, 120, 0.12) inset;
            font-size: 18px;
            color: #3d3228;
            white-space: nowrap;
            min-width: 130px;
            text-align: center;
            transition: background 0.3s, color 0.3s, box-shadow 0.3s;
        }
        .status-win {
            background: rgba(255, 215, 0, 0.22) !important;
            color: #7a5f1a !important;
            box-shadow: 0 0 0 1px #ffd700 inset;
        }
        .status-lose {
            background: rgba(232, 131, 107, 0.18) !important;
            color: #8a3a2a !important;
            box-shadow: 0 0 0 1px #e8836b inset;
        }
        .status-thinking::after {
            content: ' ·';
            animation: dots 1.5s steps(4) infinite;
        }
        @keyframes dots {
            0% { content: ' ·'; }
            25% { content: ' ··'; }
            50% { content: ' ···'; }
            75% { content: ' ····'; }
        }
        .turn-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-left: 6px;
            vertical-align: middle;
            border: 1.5px solid #6b5b4b;
        }
        .turn-black {
            background: radial-gradient(circle at 35% 35%, #666, #111);
        }
        .turn-white {
            background: radial-gradient(circle at 35% 35%, #fff, #bbb);
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(248, 242, 234, 0.40);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1.5px solid #b09a88;
            color: #4d3e30;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .btn:hover {
            background: #8a7a6a;
            color: #f5ede4;
            border-color: #8a7a6a;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(60, 40, 20, 0.12);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px 24px;
            margin-top: 18px;
            padding: 0 4px;
            z-index: 1;
            position: relative;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group .label {
            font-size: 15px;
            color: #4d3e30;
            letter-spacing: 1px;
            margin-right: 4px;
        }
        .btn-group-radio {
            display: flex;
            gap: 4px;
            background: rgba(248, 242, 234, 0.40);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 4px;
            border-radius: 40px;
            border: 1px solid rgba(180, 150, 120, 0.15);
        }
        .btn-radio {
            background: transparent;
            border: none;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-family: inherit;
            color: #4d3e30;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-radio.active {
            background: #6b5b4b;
            color: #f5ede4;
            box-shadow: 0 2px 8px rgba(60, 40, 20, 0.12);
        }
        .btn-radio:hover:not(.active) {
            background: rgba(107, 91, 75, 0.15);
        }
        .btn-hint {
            background: rgba(248, 242, 234, 0.40);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1.5px solid #b09a88;
            color: #4d3e30;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .btn-hint:hover {
            background: #8a7a6a;
            color: #f5ede4;
            border-color: #8a7a6a;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(60, 40, 20, 0.12);
        }
        .think-detail {
            margin-top: 14px;
            padding: 12px 18px;
            background: rgba(248, 242, 234, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px;
            box-shadow: 0 0 0 1px rgba(180, 150, 120, 0.08) inset;
            font-size: 14px;
            text-align: left;
            color: #3d3228;
            line-height: 1.7;
            min-height: 64px;
            max-height: 140px;
            overflow-y: auto;
        }
        .think-detail::-webkit-scrollbar {
            width: 5px;
        }
        .think-detail::-webkit-scrollbar-thumb {
            background: #b09a88;
            border-radius: 10px;
        }
        .think-detail .label {
            font-weight: bold;
            color: #6b5b4b;
        }
        .think-detail .candidate-item {
            font-size: 13px;
            padding: 2px 0;
            border-bottom: 1px dashed rgba(180, 150, 120, 0.18);
        }
        .think-detail .candidate-item:last-child {
            border-bottom: none;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #4d3e30;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #8a7a6a;
        }
        .hint-status {
            font-size: 13px;
            color: #8a7a6a;
            letter-spacing: 1px;
            text-align: right;
        }
        @media (max-width: 640px) {
            .container {
                padding: 16px;
                border-radius: 32px;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .status {
                font-size: 16px;
                min-width: auto;
                padding: 6px 16px;
            }
            .action-buttons {
                justify-content: center;
            }
            .btn {
                font-size: 14px;
                padding: 4px 14px;
            }
            .controls {
                gap: 12px;
                flex-direction: column;
                align-items: center;
            }
            .control-group {
                flex-wrap: wrap;
                justify-content: center;
            }
            .btn-radio {
                font-size: 13px;
                padding: 3px 12px;
            }
            .btn-hint {
                font-size: 14px;
                padding: 4px 16px;
            }
            .think-detail {
                font-size: 13px;
                padding: 8px 12px;
                min-height: 56px;
                max-height: 110px;
            }
            .float-box {
                padding: 24px 28px;
                border-radius: 36px;
                min-width: 140px;
            }
            .float-box .title {
                font-size: 28px;
            }
            .float-box .sub {
                font-size: 16px;
            }
            .canvas-wrapper,
            #boardCanvas,
            .float-overlay {
                border-radius: 20px;
            }
            .hint-status {
                font-size: 12px;
                text-align: center;
            }
        }
        @media (max-width: 420px) {
            .container {
                padding: 12px;
                border-radius: 24px;
            }
            .status {
                font-size: 14px;
                padding: 4px 12px;
            }
            .btn {
                font-size: 12px;
                padding: 3px 10px;
            }
            .btn-radio {
                font-size: 11px;
                padding: 2px 10px;
            }
            .btn-hint {
                font-size: 12px;
                padding: 3px 12px;
            }
            .float-box {
                padding: 18px 20px;
                border-radius: 28px;
            }
            .float-box .title {
                font-size: 22px;
            }
            .float-box .sub {
                font-size: 14px;
            }
            .canvas-wrapper,
            #boardCanvas,
            .float-overlay {
                border-radius: 16px;
            }
            .hint-status {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="canvas-wrapper">
        <canvas id="boardCanvas"></canvas>
        <div class="float-overlay" id="floatOverlay">
            <div class="float-box" id="floatBox">
                <div class="title" id="floatTitle">胜利</div>
                <div class="sub" id="floatSub">点击继续</div>
                <button class="btn-close-float" id="floatCloseBtn">继 续</button>
            </div>
        </div>
    </div>

    <div class="top-bar">
        <span class="status" id="statusMsg">黑棋回合</span>
        <div class="action-buttons">
            <button class="btn" id="undoBtn">悔棋</button>
            <button class="btn" id="restartBtn">重来</button>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <span class="label">执子</span>
            <div class="btn-group-radio">
                <button class="btn-radio active" id="btnBlack">黑</button>
                <button class="btn-radio" id="btnWhite">白</button>
            </div>
        </div>
        <div class="control-group">
            <span class="label">难度</span>
            <div class="btn-group-radio" id="difficultyGroup">
                <button class="btn-radio" data-diff="easy">简单</button>
                <button class="btn-radio active" data-diff="medium">中等</button>
                <button class="btn-radio" data-diff="hard">困难</button>
            </div>
        </div>
        <button class="btn-hint" id="hintBtn">提示</button>
    </div>

    <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-top:14px; gap:8px;">
        <label class="checkbox-group">
            <input type="checkbox" id="showThinkCheck" checked> 显示思考过程
        </label>
        <span class="hint-status" id="hintStatus">点击棋盘落子 · 黑先白后</span>
    </div>
    <div class="think-detail" id="thinkDetail">等待对局开始</div>
</div>

<script>
    "use strict";

    // ===== 音效 =====
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playTone(freq, dur, type = 'sine', vol = 0.3) {
        try {
            if (!audioCtx) audioCtx = new AudioCtx();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.value = vol;
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        } catch (_) {}
    }

    function playSound(type) {
        if (type === 'place') playTone(760, 0.07, 'sine', 0.18);
        else if (type === 'win') {
            playTone(523, 0.14, 'sine', 0.25);
            setTimeout(() => playTone(659, 0.14, 'sine', 0.25), 140);
            setTimeout(() => playTone(784, 0.25, 'sine', 0.30), 280);
        } else if (type === 'lose') {
            playTone(420, 0.18, 'sawtooth', 0.12);
            setTimeout(() => playTone(310, 0.28, 'sawtooth', 0.12), 180);
        }
    }

    // ===== 常量 =====
    const SIZE = 15,
        EMPTY = 0,
        BLACK = 1,
        WHITE = 2,
        MAX_LOGIC = 620;
    const SCORES = {
        FIVE: 1e6,
        LIVE_FOUR: 1e5,
        RUSH_FOUR: 1e4,
        LIVE_THREE: 5e3,
        SLEEP_THREE: 1e3,
        LIVE_TWO: 500,
        SLEEP_TWO: 100,
        ONE: 10
    };
    const DIRS = [
        [1, 0],
        [0, 1],
        [1, 1],
        [1, -1]
    ];
    const DIFFICULTY = { easy: 0.5, medium: 0.9, hard: 1.4 };

    // ===== 状态 =====
    let board = [],
        history = [],
        currentPlayer = BLACK,
        gameOver = false,
        isAIThinking = false,
        humanPlayer = BLACK,
        aiPlayer = WHITE,
        lastMove = null,
        difficulty = 'medium',
        hintMove = null;

    let logicSize = MAX_LOGIC,
        margin, cellSize, pieceRadius;

    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('statusMsg');
    const thinkDetail = document.getElementById('thinkDetail');
    const showThinkCheck = document.getElementById('showThinkCheck');
    const hintBtn = document.getElementById('hintBtn');
    const hintStatus = document.getElementById('hintStatus');
    const floatOverlay = document.getElementById('floatOverlay');
    const floatBox = document.getElementById('floatBox');
    const floatTitle = document.getElementById('floatTitle');
    const floatSub = document.getElementById('floatSub');
    const floatCloseBtn = document.getElementById('floatCloseBtn');
    const btnBlack = document.getElementById('btnBlack');
    const btnWhite = document.getElementById('btnWhite');
    const undoBtn = document.getElementById('undoBtn');
    const restartBtn = document.getElementById('restartBtn');

    // ===== 自适应 =====
    function setupCanvas() {
        const dpr = devicePixelRatio || 1;
        const wrapper = canvas.parentElement;
        const wrapperWidth = wrapper.clientWidth;
        logicSize = Math.min(wrapperWidth, MAX_LOGIC);
        margin = logicSize * 0.048;
        cellSize = (logicSize - 2 * margin) / (SIZE - 1);
        pieceRadius = cellSize * 0.43;
        canvas.width = logicSize * dpr;
        canvas.height = logicSize * dpr;
        canvas.style.width = logicSize + 'px';
        canvas.style.height = logicSize + 'px';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        ctx.imageSmoothingEnabled = true;
    }

    function resizeAndRedraw() { setupCanvas();
        drawBoard(); }

    // ===== 增强的评分函数 =====

    // 检测特殊模式（跳活三、跳四等）并返回额外加分
    function detectSpecialPatterns(board, row, col, player, dx, dy) {
        // 仅当空格周围有棋子时检测，避免重复计算
        let extra = 0;
        // 检查 X_XXX 或 XX_XX 模式
        // 正方向检测
        let r = row + dx,
            c = col + dy;
        let cnt = 0;
        while (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === player) { cnt++;
            r += dx;
            c += dy; }
        if (cnt === 0) return 0; // 至少有一个相邻棋子

        // 检查间隔一个空位的模式
        // 模式1: X_XXX (中间空一格)
        const step = 2;
        let found = false;
        // 检查正方向第二个位置是否为 player
        const r2 = row + dx * 2,
            c2 = col + dy * 2;
        if (r2 >= 0 && r2 < SIZE && c2 >= 0 && c2 < SIZE && board[r2][c2] === player) {
            // 检查中间一格是否为空
            const r1 = row + dx,
                c1 = col + dy;
            if (board[r1][c1] === EMPTY) {
                // 再检查连续方向是否还有更多
                let cnt2 = 1;
                let rr = r2 + dx,
                    cc = c2 + dy;
                while (rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && board[rr][cc] === player) { cnt2++;
                    rr += dx;
                    cc += dy; }
                if (cnt2 >= 2) { // 形成 X_XXX (至少3个连续)
                    extra += SCORES.LIVE_THREE * 2; // 跳活三威胁极大
                }
            }
        }
        // 模式2: XX_XX (两端各有2子，中间空一格)
        // 检查正方向第二个位置为 player，且负方向第二个也为 player
        const r_neg2 = row - dx * 2,
            c_neg2 = col - dy * 2;
        if (r2 >= 0 && r2 < SIZE && c2 >= 0 && c2 < SIZE && board[r2][c2] === player &&
            r_neg2 >= 0 && r_neg2 < SIZE && c_neg2 >= 0 && c_neg2 < SIZE && board[r_neg2][c_neg2] === player) {
            // 中间两个空位检查
            const r1 = row + dx,
                c1 = col + dy;
            const r_neg1 = row - dx,
                c_neg1 = col - dy;
            if (board[r1][c1] === EMPTY && board[r_neg1][c_neg1] === EMPTY) {
                extra += SCORES.LIVE_FOUR; // 跳四，几乎必胜
            }
        }
        return extra;
    }

    // 评估某个点对某方的综合威胁，返回 { score, liveThrees, rushFours }
    function evaluatePointDetailed(board, row, col, player) {
        if (board[row][col] !== EMPTY) return { score: 0, liveThrees: 0, rushFours: 0 };
        let totalScore = 0;
        let liveThrees = 0,
            rushFours = 0;
        board[row][col] = player;
        for (const [dx, dy] of DIRS) {
            let cnt = 1,
                ends = 0;
            let r = row + dx,
                c = col + dy;
            while (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === player) { cnt++;
                r += dx;
                c += dy; }
            if (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === EMPTY) ends++;
            r = row - dx;
            c = col - dy;
            while (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === player) { cnt++;
                r -= dx;
                c -= dy; }
            if (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === EMPTY) ends++;
            if (cnt >= 5) { board[row][col] = EMPTY; return { score: SCORES.FIVE, liveThrees: 0, rushFours: 0 }; }
            const baseScore = getScore(cnt, ends);
            totalScore += baseScore;
            // 统计活三和冲四
            if (cnt === 3 && ends === 2) liveThrees++;
            if (cnt === 4 && ends === 1) rushFours++;
            // 检测特殊模式
            totalScore += detectSpecialPatterns(board, row, col, player, dx, dy);
        }
        board[row][col] = EMPTY;
        return { score: totalScore, liveThrees, rushFours };
    }

    // 保留原始 getScore 用于基础评分
    function getScore(cnt, ends) {
        if (cnt >= 5) return SCORES.FIVE;
        if (ends === 0) return 0;
        if (cnt === 4) return ends === 2 ? SCORES.LIVE_FOUR : SCORES.RUSH_FOUR;
        if (cnt === 3) return ends === 2 ? SCORES.LIVE_THREE : SCORES.SLEEP_THREE;
        if (cnt === 2) return ends === 2 ? SCORES.LIVE_TWO : SCORES.SLEEP_TWO;
        if (cnt === 1) return ends === 2 ? SCORES.ONE : 0;
        return 0;
    }

    // 简化的 evaluatePoint 用于兼容旧调用（我们将在 aiMove 中使用详细版本）
    function evaluatePoint(board, row, col, player) {
        const result = evaluatePointDetailed(board, row, col, player);
        return result.score;
    }

    // ===== 候选点剪枝（增强） =====
    function getCandidateMoves(board, lastMoveOpponent) {
        const set = new Set();
        let hasStone = false;
        // 1. 原有 2 格邻域
        for (let r = 0; r < SIZE; r++)
            for (let c = 0; c < SIZE; c++) {
                if (board[r][c] !== EMPTY) {
                    hasStone = true;
                    for (let dr = -2; dr <= 2; dr++)
                        for (let dc = -2; dc <= 2; dc++) {
                            const nr = r + dr,
                                nc = c + dc;
                            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === EMPTY)
                                set.add(nr * SIZE + nc);
                        }
                }
            }

        // 2. 对手最近落子周围 1 格（防守关键点）
        if (lastMoveOpponent) {
            const { row, col } = lastMoveOpponent;
            for (let dr = -1; dr <= 1; dr++)
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = row + dr,
                        nc = col + dc;
                    if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === EMPTY)
                        set.add(nr * SIZE + nc);
                }
        }

        // 3. 能直接成五的空点（快速检测）
        for (let r = 0; r < SIZE; r++)
            for (let c = 0; c < SIZE; c++) {
                if (board[r][c] !== EMPTY) continue;
                // 尝试落子，检查是否成五（仅检查当前玩家，但候选点需要包含双方，我们简化：只考虑当前玩家和对手，但为了不增加太多开销，我们只检查当前玩家（在aiMove中调用时会传入当前玩家）
                // 但这里我们不知道玩家，所以跳过，在 aiMove 中单独处理
            }

        if (!hasStone) return [{ row: Math.floor(SIZE / 2), col: Math.floor(SIZE / 2) }];
        return Array.from(set).map(v => ({ row: Math.floor(v / SIZE), col: v % SIZE }));
    }

    // ===== AI 走法（含动态防守权重） =====
    function aiMove(board, player) {
        const opp = player === BLACK ? WHITE : BLACK;
        // 先评估对手的进攻威胁，以调整防守权重
        let opponentMaxThreat = 0;
        // 简单评估：遍历所有空点，看对手落子后的活三/冲四数量
        const candidates = getCandidateMoves(board, lastMove); // 传入对手最近落子（用全局 lastMove 代表对手，需注意）
        // 但 lastMove 可能是全局，我们需要传入对手最近落子，这里用全局变量 lastMove（若存在且是对方下的）
        let oppLastMove = null;
        if (history.length > 0) {
            const last = history[history.length - 1];
            if (last.player === opp) oppLastMove = { row: last.row, col: last.col };
        }
        const allCandidates = getCandidateMoves(board, oppLastMove);
        for (const m of allCandidates) {
            const detail = evaluatePointDetailed(board, m.row, m.col, opp);
            // 威胁程度：活三*2 + 冲四*3 + 特殊模式（简化）
            let threat = detail.liveThrees * 2 + detail.rushFours * 3;
            if (detail.score >= SCORES.FIVE) threat = 10; // 成五威胁最大
            if (threat > opponentMaxThreat) opponentMaxThreat = threat;
        }

        // 根据对手威胁动态调整防守权重
        let baseDefWeight = DIFFICULTY[difficulty] || 0.9;
        let defWeight = baseDefWeight;
        if (opponentMaxThreat >= 4) defWeight = Math.min(baseDefWeight + 0.5, 2.0);
        else if (opponentMaxThreat >= 2) defWeight = Math.min(baseDefWeight + 0.2, 1.5);

        // 评估候选点（使用增强的详细评分）
        const candidates2 = getCandidateMoves(board, oppLastMove);
        if (!candidates2.length) return null;
        let best = -1,
            bestMove = candidates2[0],
            bestA = 0,
            bestD = 0;
        const scored = [];
        for (const m of candidates2) {
            const aDetail = evaluatePointDetailed(board, m.row, m.col, player);
            const dDetail = evaluatePointDetailed(board, m.row, m.col, opp);
            const attack = aDetail.score;
            const defense = dDetail.score;
            // 威胁叠加奖励：如果进攻方形成多个活三或冲四，大幅加分
            let attackBonus = 0;
            if (aDetail.liveThrees >= 2) attackBonus += SCORES.LIVE_FOUR * 2; // 双活三几乎必胜
            if (aDetail.rushFours >= 2) attackBonus += SCORES.RUSH_FOUR * 2;
            if (aDetail.liveThrees >= 1 && aDetail.rushFours >= 1) attackBonus += SCORES.LIVE_FOUR * 1.5; // 四三
            const total = (attack + attackBonus) + defense * defWeight;
            scored.push({ row: m.row, col: m.col, attack, defense, total });
            if (total > best) { best = total;
                bestMove = { row: m.row, col: m.col };
                bestA = attack;
                bestD = defense; }
        }
        scored.sort((x, y) => y.total - x.total);
        return { bestMove, attack: bestA, defense: bestD, total: best, candidatesCount: candidates2.length, top5: scored.slice(0, 5) };
    }

    // ===== 原始 AI 调用（兼容旧接口） =====
    // 保留旧的 evaluatePoint 和 getCandidateMoves 但已更新

    // ===== 胜负判定 =====
    function checkWin(board, row, col, player) {
        if (board[row][col] !== player) return false;
        for (const [dx, dy] of DIRS) {
            let cnt = 1;
            let r = row + dx,
                c = col + dy;
            while (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === player) { cnt++;
                r += dx;
                c += dy; }
            r = row - dx;
            c = col - dy;
            while (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === player) { cnt++;
                r -= dx;
                c -= dy; }
            if (cnt >= 5) return true;
        }
        return false;
    }

    function isBoardFull() {
        for (let r = 0; r < SIZE; r++)
            for (let c = 0; c < SIZE; c++)
                if (board[r][c] === EMPTY) return false;
        return true;
    }

    // ===== 绘图（不变） =====
    function drawBoard() {
        const w = logicSize,
            h = logicSize;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#e8d5b5';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = '#3d3228';
        ctx.lineWidth = 1.2;
        for (let i = 0; i < SIZE; i++) {
            const pos = margin + i * cellSize;
            ctx.beginPath();
            ctx.moveTo(pos, margin);
            ctx.lineTo(pos, h - margin);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(margin, pos);
            ctx.lineTo(w - margin, pos);
            ctx.stroke();
        }

        const stars = [
            [3, 3],
            [3, 11],
            [11, 3],
            [11, 11],
            [7, 7]
        ];
        ctx.fillStyle = '#3d3228';
        for (const [r, c] of stars) {
            const x = margin + c * cellSize,
                y = margin + r * cellSize;
            const rad = Math.max(3, cellSize * 0.1);
            ctx.beginPath();
            ctx.arc(x, y, rad, 0, 2 * Math.PI);
            ctx.fill();
        }

        for (let i = 0; i < history.length; i++) {
            const { row, col, player } = history[i];
            const x = margin + col * cellSize,
                y = margin + row * cellSize;
            const rad = pieceRadius;
            const grad = ctx.createRadialGradient(x - rad * 0.2, y - rad * 0.2, rad * 0.1, x, y, rad);
            if (player === BLACK) {
                grad.addColorStop(0, '#666');
                grad.addColorStop(0.6, '#222');
                grad.addColorStop(1, '#000');
            } else {
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.6, '#e8e8e8');
                grad.addColorStop(1, '#b0b0b0');
            }
            ctx.beginPath();
            ctx.arc(x, y, rad, 0, 2 * Math.PI);
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(0,0,0,0.30)';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
            if (player === WHITE) {
                ctx.beginPath();
                ctx.arc(x - rad * 0.15, y - rad * 0.15, rad * 0.18, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.arc(x - rad * 0.12, y - rad * 0.12, rad * 0.08, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.fill();
            }
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 0;
        for (let i = 0; i < history.length; i++) {
            const { row, col, player } = history[i];
            const x = margin + col * cellSize,
                y = margin + row * cellSize;
            const num = (i + 1).toString();
            const fs = Math.min(cellSize * 0.40, 16);
            ctx.font = `bold ${fs}px "华文楷体","KaiTi","PingFang SC",sans-serif`;
            ctx.fillStyle = player === BLACK ? 'rgba(255,255,255,0.85)' : 'rgba(30,25,20,0.80)';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 4;
            ctx.fillText(num, x, y + 1);
            ctx.shadowBlur = 0;
        }

        if (hintMove && !gameOver && !isAIThinking && currentPlayer === humanPlayer) {
            const { row, col } = hintMove;
            const x = margin + col * cellSize,
                y = margin + row * cellSize;
            ctx.save();
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = '#4caf50';
            ctx.shadowColor = 'rgba(76,175,80,0.4)';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(x, y, pieceRadius * 0.35, 0, 2 * Math.PI);
            ctx.fill();
            ctx.globalAlpha = 0.25;
            ctx.fillStyle = '#4caf50';
            ctx.shadowBlur = 24;
            ctx.beginPath();
            ctx.arc(x, y, pieceRadius * 0.65, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
        }

        if (lastMove) {
            const { row, col } = lastMove;
            const x = margin + col * cellSize,
                y = margin + row * cellSize;
            ctx.save();
            ctx.strokeStyle = 'rgba(255,215,0,0.6)';
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(255,215,0,0.2)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(x, y, pieceRadius + 4, 0, 2 * Math.PI);
            ctx.stroke();
            ctx.restore();
        }
    }

    // ===== 弹窗、状态更新等（不变） =====
    function showFloat(title, sub, type) {
        floatTitle.textContent = title;
        floatSub.textContent = sub || '点击继续';
        floatBox.className = 'float-box ' + type;
        floatOverlay.classList.add('show');
    }

    function hideFloat() { floatOverlay.classList.remove('show'); }
    floatCloseBtn.addEventListener('click', hideFloat);
    floatOverlay.addEventListener('click', e => { if (e.target === floatOverlay) hideFloat(); });

    function updateStatus(msg, color, thinking = false, win = false, lose = false) {
        statusMsg.innerHTML = `${msg} <span class="turn-indicator turn-${color}"></span>`;
        statusMsg.className = 'status';
        if (win) statusMsg.classList.add('status-win');
        if (lose) statusMsg.classList.add('status-lose');
        if (thinking) statusMsg.classList.add('status-thinking');
        hintStatus.textContent = gameOver ? '对局结束，点击重来或继续' :
            thinking ? 'AI 思考中 ...' : '点击棋盘落子 · 黑先白后';
    }

    function updateThinkDetail(info) {
        if (!showThinkCheck.checked) {
            thinkDetail.innerHTML = '<span style="color:#888;">（思考过程已隐藏）</span>';
            return;
        }
        if (!info) { thinkDetail.innerHTML = '<span style="color:#888;">等待 AI 走棋</span>'; return; }
        let html = `<div><span class="label">候选点：</span>${info.candidatesCount}</div>` +
            `<div><span class="label">最佳落子：</span>(${info.bestMove.row}, ${info.bestMove.col}) 进攻=${info.attack}，防守=${info.defense}，综合=${info.total.toFixed(1)}</div>` +
            `<div style="margin-top:4px;"><span class="label">前5候选：</span></div>`;
        for (const item of info.top5) {
            html += `<div class="candidate-item">(${item.row}, ${item.col}) 攻=${item.attack} 防=${item.defense} 综=${item.total.toFixed(1)}</div>`;
        }
        thinkDetail.innerHTML = html;
    }

    // ===== 游戏逻辑（使用新 aiMove） =====
    function placePiece(row, col) {
        if (gameOver || isAIThinking || board[row][col] !== EMPTY || currentPlayer !== humanPlayer) return false;
        board[row][col] = currentPlayer;
        history.push({ row, col, player: currentPlayer });
        lastMove = { row, col };
        hintMove = null;
        playSound('place');
        drawBoard();

        if (checkWin(board, row, col, currentPlayer)) {
            gameOver = true;
            const isHumanWin = currentPlayer === humanPlayer;
            playSound(isHumanWin ? 'win' : 'lose');
            updateStatus(isHumanWin ? '你赢了' : 'AI 赢了', currentPlayer === BLACK ? 'black' : 'white', false, isHumanWin, !isHumanWin);
            showFloat(isHumanWin ? '你赢了' : 'AI 赢了', isHumanWin ? '精妙的一手' : '再接再厉', isHumanWin ? 'win' : 'lose');
            drawBoard();
            return true;
        }
        if (isBoardFull()) {
            gameOver = true;
            updateStatus('平局', 'black');
            showFloat('平局', '旗鼓相当', 'draw');
            return true;
        }

        currentPlayer = currentPlayer === BLACK ? WHITE : BLACK;
        if (currentPlayer === aiPlayer) {
            updateStatus('AI 思考中', aiPlayer === BLACK ? 'black' : 'white', true);
            isAIThinking = true;
            setTimeout(doAIMove, 50);
        } else {
            updateStatus('你的回合', humanPlayer === BLACK ? 'black' : 'white');
        }
        return true;
    }

    function doAIMove() {
        if (gameOver || currentPlayer !== aiPlayer) { isAIThinking = false; return; }
        const result = aiMove(board, aiPlayer);
        if (!result) { isAIThinking = false; return; }
        const { bestMove, attack, defense, total, candidatesCount, top5 } = result;
        const { row, col } = bestMove;
        board[row][col] = aiPlayer;
        history.push({ row, col, player: aiPlayer });
        lastMove = { row, col };
        hintMove = null;
        playSound('place');
        drawBoard();
        updateThinkDetail({ bestMove: { row, col }, attack, defense, total, candidatesCount, top5 });

        if (checkWin(board, row, col, aiPlayer)) {
            gameOver = true;
            const isHumanWin = aiPlayer !== humanPlayer;
            playSound(isHumanWin ? 'lose' : 'win');
            updateStatus(isHumanWin ? 'AI 赢了' : '你赢了', aiPlayer === BLACK ? 'black' : 'white', false, !isHumanWin, isHumanWin);
            showFloat(isHumanWin ? 'AI 赢了' : '你赢了', isHumanWin ? '再接再厉' : '精妙的一手', isHumanWin ? 'lose' : 'win');
            isAIThinking = false;
            drawBoard();
            return;
        }
        if (isBoardFull()) {
            gameOver = true;
            updateStatus('平局', 'black');
            showFloat('平局', '旗鼓相当', 'draw');
            isAIThinking = false;
            return;
        }

        currentPlayer = humanPlayer;
        isAIThinking = false;
        updateStatus('你的回合', humanPlayer === BLACK ? 'black' : 'white');
    }

    // ===== 提示、悔棋、重置等（不变） =====
    function generateHint() {
        if (gameOver || isAIThinking || currentPlayer !== humanPlayer) { hintMove = null;
            drawBoard(); return; }
        const result = aiMove(board, humanPlayer);
        if (result) {
            hintMove = result.bestMove;
            drawBoard();
            hintStatus.textContent = '提示：已标记最佳落子位置';
            setTimeout(() => {
                if (!gameOver && !isAIThinking) hintStatus.textContent = '点击棋盘落子 · 黑先白后';
            }, 3000);
        } else {
            hintMove = null;
            drawBoard();
        }
    }

    function undoMove() {
        if (gameOver || isAIThinking || history.length === 0) return;
        let removed = 0;
        while (removed < 2 && history.length > 0) {
            const last = history.pop();
            board[last.row][last.col] = EMPTY;
            removed++;
            currentPlayer = last.player;
        }
        if (currentPlayer !== humanPlayer) {
            if (history.length > 0) {
                const last = history.pop();
                board[last.row][last.col] = EMPTY;
                currentPlayer = last.player;
            } else currentPlayer = humanPlayer;
        }
        if (currentPlayer !== humanPlayer) currentPlayer = humanPlayer;
        lastMove = history.length ? { row: history[history.length - 1].row, col: history[history.length - 1].col } : null;
        hintMove = null;
        drawBoard();
        gameOver = false;
        updateStatus('你的回合', humanPlayer === BLACK ? 'black' : 'white');
        updateThinkDetail(null);
        hideFloat();
    }

    function resetGame(firstPlayerColor) {
        if (firstPlayerColor !== undefined) {
            humanPlayer = firstPlayerColor;
            aiPlayer = humanPlayer === BLACK ? WHITE : BLACK;
        }
        board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
        history = [];
        currentPlayer = humanPlayer;
        gameOver = false;
        isAIThinking = false;
        lastMove = null;
        hintMove = null;
        resizeAndRedraw();
        updateThinkDetail(null);
        hideFloat();
        if (humanPlayer === WHITE) {
            currentPlayer = aiPlayer;
            updateStatus('AI 思考中', aiPlayer === BLACK ? 'black' : 'white', true);
            isAIThinking = true;
            setTimeout(doAIMove, 50);
        } else {
            updateStatus('你的回合', 'black');
        }
        btnBlack.classList.toggle('active', humanPlayer === BLACK);
        btnWhite.classList.toggle('active', humanPlayer === WHITE);
        hintStatus.textContent = '点击棋盘落子 · 黑先白后';
    }

    // ===== 事件绑定 =====
    canvas.addEventListener('click', e => {
        if (gameOver || isAIThinking || currentPlayer !== humanPlayer) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = logicSize / rect.width;
        const scaleY = logicSize / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;
        let col = Math.round((mx - margin) / cellSize);
        let row = Math.round((my - margin) / cellSize);
        if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;
        if (Math.abs(mx - (margin + col * cellSize)) > cellSize * 0.6 ||
            Math.abs(my - (margin + row * cellSize)) > cellSize * 0.6) return;
        placePiece(row, col);
    });

    window.addEventListener('resize', resizeAndRedraw);

    restartBtn.addEventListener('click', () => resetGame(humanPlayer));
    undoBtn.addEventListener('click', undoMove);
    btnBlack.addEventListener('click', () => resetGame(BLACK));
    btnWhite.addEventListener('click', () => resetGame(WHITE));

    document.querySelectorAll('#difficultyGroup .btn-radio').forEach(el => {
        el.addEventListener('click', function() {
            document.querySelectorAll('#difficultyGroup .btn-radio').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            difficulty = this.dataset.diff;
        });
    });

    hintBtn.addEventListener('click', generateHint);

    showThinkCheck.addEventListener('change', () => {
        if (showThinkCheck.checked) {
            if (thinkDetail.innerHTML.includes('隐藏') || thinkDetail.innerHTML.includes('等待'))
                updateThinkDetail(null);
        } else {
            thinkDetail.innerHTML = '<span style="color:#888;">（思考过程已隐藏）</span>';
        }
    });

    // ===== 启动 =====
    setupCanvas();
    resetGame(BLACK);
</script>
</body>
</html>
