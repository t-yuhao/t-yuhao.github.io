<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>五子棋 · 明镜弈局</title>
    <style>
        /* ===== 无算法版 毛玻璃风格 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "华文楷体", "KaiTi", "Segoe UI", "PingFang SC", sans-serif;
            background: radial-gradient(ellipse at 50% 40%, #f0ecf8, #d9d4e6);
            padding: 12px;
        }
        .glass {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 20px 60px rgba(60, 40, 20, 0.18);
        }
        .top-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 40px;
        }
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .label {
            color: #2d2a3e;
            letter-spacing: 1px;
            white-space: nowrap;
            font-weight: 500;
        }
        .btn-group {
            display: inline-flex;
            background: rgba(200, 190, 210, 0.25);
            padding: 3px;
            border-radius: 30px;
        }
        .btn-opt {
            border: none;
            background: transparent;
            padding: 4px 14px;
            border-radius: 25px;
            font-size: 12px;
            color: #4d3e30;
            cursor: pointer;
            transition: 0.25s;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .btn-opt.active {
            background: #b8860b;
            color: #fff;
            box-shadow: 0 2px 12px rgba(184, 134, 11, 0.25);
        }
        .btn-opt:active {
            transform: scale(0.94);
        }
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 18px;
            border-radius: 30px;
        }
        .status-text {
            font-size: 15px;
            font-weight: 500;
            color: #2d2a3e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .turn-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(0, 0, 0, 0.08);
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .turn-dot.black {
            background: radial-gradient(circle at 35% 35%, #666, #111);
        }
        .turn-dot.white {
            background: radial-gradient(circle at 35% 35%, #fff, #ccc);
        }
        .turn-dot.win {
            background: radial-gradient(circle at 35% 35%, #f9d976, #e8b42c);
            box-shadow: 0 0 20px rgba(249, 217, 118, 0.4);
        }
        .mode-hint {
            font-size: 12px;
            color: #8c7a6b;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .board-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 32px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.20);
            touch-action: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #boardCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center;
            border-radius: 32px;
        }
        .zoom-confirm-btn {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(60px);
            background: linear-gradient(135deg, #d4a843, #b8860b);
            color: #fff;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(184, 134, 11, 0.30);
            pointer-events: none;
            opacity: 0;
            transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            border: none;
            font-family: inherit;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .zoom-confirm-btn.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .zoom-confirm-btn:active {
            transform: translateX(-50%) scale(0.94);
        }

        /* ----- 轻量级思考指示（不遮挡棋盘） ----- */
        .thinking-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 30px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 20;
            pointer-events: none;
        }
        .thinking-indicator .spinner-small {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #f5e3b0;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .thinking-indicator.show {
            display: flex;
        }

        /* ----- 模态框（更小、半透明、不遮挡整个棋盘） ----- */
        .modal-overlay {
            position: absolute;
            inset: 20px;
            background: rgba(0,0,0,0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 30;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 18px 28px 16px;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transform: scale(0.9);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 140px;
            max-width: 80%;
        }
        .modal-overlay.show .modal-card {
            transform: scale(1);
        }
        .modal-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }
        .modal-title.win { color: #b8860b; }
        .modal-title.lose { color: #c0392b; }
        .modal-title.draw { color: #5d6d7e; }
        .modal-sub {
            font-size: 14px;
            color: #6b5b4b;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .modal-btn {
            padding: 6px 24px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #d4a843, #b8860b);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(184, 134, 11, 0.20);
        }
        .modal-btn:hover { transform: scale(1.04); }
        .modal-btn:active { transform: scale(0.94); }

        .bottom-bar {
            display: flex;
            gap: 10px;
        }
        .btn-action {
            flex: 1;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(180, 160, 140, 0.25);
            color: #4d3e30;
            padding: 9px 0;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            font-family: inherit;
            letter-spacing: 1px;
            font-weight: 500;
        }
        .btn-action:hover {
            background: rgba(255, 255, 255, 0.50);
        }
        .btn-action:active {
            transform: scale(0.94);
        }
        .think-box {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 13px;
            color: #2d2a3e;
            max-height: 100px;
            overflow-y: auto;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.3);
            min-height: 44px;
            transition: 0.3s;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .think-box::-webkit-scrollbar {
            width: 4px;
        }
        .think-box::-webkit-scrollbar-thumb {
            background: #b09a88;
            border-radius: 10px;
        }
        @media (max-width: 640px) {
            .container { padding: 14px; border-radius: 32px; gap: 10px; }
            .top-controls { padding: 10px 14px; border-radius: 30px; gap: 8px; }
            .btn-opt { font-size: 11px; padding: 3px 10px; }
            .label, .status-text, .btn-action, .think-box { font-size: 12px; }
            .turn-dot { width: 14px; height: 14px; }
            .modal-card { padding: 14px 20px 12px; border-radius: 24px; }
            .modal-title { font-size: 20px; }
            .modal-btn { font-size: 13px; padding: 5px 18px; }
            .zoom-confirm-btn { font-size: 12px; padding: 6px 18px; bottom: 12px; }
            .thinking-indicator { font-size: 11px; padding: 4px 12px; top: 8px; right: 8px; }
        }
        @media (max-width: 420px) {
            .container { padding: 10px; border-radius: 24px; }
            .top-controls { padding: 8px 10px; border-radius: 24px; gap: 6px; }
            .btn-opt, .label { font-size: 10px; padding: 2px 8px; }
            .modal-title { font-size: 18px; }
            .btn-action { font-size: 11px; padding: 7px 0; }
            .think-box { font-size: 11px; padding: 6px 12px; min-height: 36px; }
            .mode-hint { font-size: 10px; }
            .status-text { font-size: 11px; }
            .turn-dot { width: 12px; height: 12px; }
            .modal-overlay { inset: 10px; }
            .modal-card { padding: 12px 16px 10px; border-radius: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ===== 顶部控制栏 ===== -->
    <div class="top-controls glass">
        <div class="control-row">
            <div class="control-item">
                <span class="label">执子</span>
                <div class="btn-group">
                    <button class="btn-opt active" id="btnBlack">黑</button>
                    <button class="btn-opt" id="btnWhite">白</button>
                </div>
            </div>
            <div class="control-item">
                <span class="label">难度</span>
                <div class="btn-group" id="diffGroup">
                    <button class="btn-opt" data-diff="easy">简单</button>
                    <button class="btn-opt active" data-diff="medium">中等</button>
                    <button class="btn-opt" data-diff="hard">困难</button>
                    <button class="btn-opt" data-diff="expert">专家</button>
                </div>
            </div>
        </div>
        <div class="control-row">
            <div class="control-item">
                <span class="label">棋盘</span>
                <div class="btn-group" id="sizeGroup">
                    <button class="btn-opt" data-size="11">11</button>
                    <button class="btn-opt active" data-size="13">13</button>
                    <button class="btn-opt" data-size="15">15</button>
                    <button class="btn-opt" data-size="19">19</button>
                </div>
            </div>
            <div class="control-item">
                <span class="label">触控</span>
                <div class="btn-group" id="touchGroup">
                    <button class="btn-opt active" data-mode="direct">直接</button>
                    <button class="btn-opt" data-mode="zoom">放大</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 状态栏 ===== -->
    <div class="status-bar glass">
        <div class="status-text">
            <span class="turn-dot black" id="turnDot"></span>
            <span id="statusMsg">你的回合</span>
        </div>
        <span class="mode-hint" id="modeHint">点击棋盘落子</span>
    </div>

    <!-- ===== 棋盘 ===== -->
    <div class="board-container" id="boardWrapper">
        <canvas id="boardCanvas"></canvas>
        <button class="zoom-confirm-btn" id="confirmPlaceBtn">确认落子</button>
        <!-- 轻量思考指示 -->
        <div class="thinking-indicator" id="thinkingIndicator">
            <div class="spinner-small"></div>
            <span>AI思考中</span>
        </div>
        <!-- 模态框（小尺寸） -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card">
                <div class="modal-title" id="modalTitle">对局结束</div>
                <div class="modal-sub" id="modalSub">结果</div>
                <button class="modal-btn" id="modalRestartBtn">重开</button>
            </div>
        </div>
    </div>

    <!-- ===== 底部按钮 ===== -->
    <div class="bottom-bar">
        <button class="btn-action" id="undoBtn">悔棋</button>
        <button class="btn-action" id="restartBtn">重开</button>
        <button class="btn-action" id="hintBtn">推荐</button>
    </div>

    <!-- ===== 思考框 ===== -->
    <div class="think-box" id="thinkBox">欢迎，你执黑先行。中等难度。</div>
</div>

<script>
    // ================================================================
    //  五子棋 · 明镜弈局 · AI 整合版
    //  只显示AI威胁，闪烁3秒后自动消失
    // ================================================================

    (() => {
        'use strict';

        // ---------- DOM ----------
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const wrap = document.getElementById('boardWrapper');
        const turnDot = document.getElementById('turnDot');
        const statusMsg = document.getElementById('statusMsg');
        const modeHint = document.getElementById('modeHint');
        const thinkBox = document.getElementById('thinkBox');
        const confirmBtn = document.getElementById('confirmPlaceBtn');
        const thinkingIndicator = document.getElementById('thinkingIndicator');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalSub = document.getElementById('modalSub');
        const modalRestartBtn = document.getElementById('modalRestartBtn');

        const btnBlack = document.getElementById('btnBlack');
        const btnWhite = document.getElementById('btnWhite');
        const diffBtns = document.querySelectorAll('#diffGroup .btn-opt');
        const sizeBtns = document.querySelectorAll('#sizeGroup .btn-opt');
        const touchBtns = document.querySelectorAll('#touchGroup .btn-opt');
        const undoBtn = document.getElementById('undoBtn');
        const restartBtn = document.getElementById('restartBtn');
        const hintBtn = document.getElementById('hintBtn');

        // ---------- 常量 ----------
        const EMPTY = 0, BLACK = 1, WHITE = 2;
        const DIRS = [[1,0],[0,1],[1,1],[1,-1]];

        // ---------- 状态 ----------
        let SIZE = 13;
        let board = [];
        let currentPlayer = BLACK;
        let gameOver = false;
        let winner = null;
        let moveHistory = [];
        let isThinking = false;
        let hintMove = null;
        let lastMove = null;

        let playerColor = BLACK;
        let aiColor = WHITE;

        let depthMin = 4, depthMax = 8;

        let touchMode = 'direct';
        let zoomTarget = null;
        let isZooming = false;

        // 特效
        let effects = [];
        let shake = 0, flash = 0;

        // 威胁标记 (只存AI威胁)
        let threatCells = []; // [{row, col, type}]
        let threatFlash = 0;
        let threatTimer = null;
        let threatTimeout = null; // 用于自动清除

        // 音频
        let audioCtx = null;

        // 画布几何 (实际像素尺寸)
        let canvasPixelSize = 600;
        let scaleFactor = 1;
        let PADDING = 28;
        let CELL_SIZE = 0;
        let PIECE_RADIUS = 0;

        // AI信息
        let lastAIInfo = '';

        // ---------- 工具 ----------
        function gridToPos(row, col) {
            return { x: PADDING + col * CELL_SIZE, y: PADDING + row * CELL_SIZE };
        }
        function posToGrid(x, y) {
            const col = Math.round((x - PADDING) / CELL_SIZE);
            const row = Math.round((y - PADDING) / CELL_SIZE);
            if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return null;
            return { row, col };
        }
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }
        function isBoardFull() {
            for (let r=0; r<SIZE; r++) for (let c=0; c<SIZE; c++) if (board[r][c]===EMPTY) return false;
            return true;
        }
        function countPieces() {
            let cnt=0; for (let r=0; r<SIZE; r++) for (let c=0; c<SIZE; c++) if (board[r][c]!==EMPTY) cnt++;
            return cnt;
        }

        // ---------- 音效 ----------
        function playTone(freq, duration, type='sine', volume=0.45) {
            try {
                if (!audioCtx) audioCtx = new(window.AudioContext||window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.value = volume;
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(_) {}
        }
        function playSound(type) {
            if (type === 'place') playTone(820,0.08,'sine',0.55);
            else if (type === 'win') {
                [523,659,784].forEach((f,i)=>setTimeout(()=>playTone(f,0.18+i*0.06,'sine',0.50), i*150));
            } else if (type === 'lose') {
                [420,310].forEach((f,i)=>setTimeout(()=>playTone(f,0.22+i*0.10,'sawtooth',0.32), i*200));
            } else if (type === 'hint') {
                playTone(680,0.10,'sine',0.40);
            } else if (type === 'threat') {
                playTone(1200,0.06,'sine',0.35);
                setTimeout(()=>playTone(1500,0.06,'sine',0.30), 80);
            }
        }

        // ---------- 棋盘管理 ----------
        function initBoard() {
            board = [];
            for (let r=0; r<SIZE; r++) board.push(new Array(SIZE).fill(EMPTY));
            if (playerColor === BLACK) currentPlayer = BLACK;
            else currentPlayer = BLACK;
            gameOver = false; winner = null;
            moveHistory = [];
            hintMove = null; lastMove = null;
            zoomTarget = null; isZooming = false;
            effects = []; shake = 0; flash = 0;
            clearThreats();
            modalOverlay.classList.remove('show');
            thinkingIndicator.classList.remove('show');
            confirmBtn.classList.remove('show');
            canvas.style.transform = '';
            lastAIInfo = '';
            updateUI();
            drawBoard();
            thinkBox.textContent = `欢迎，你执${playerColor===BLACK?'黑':'白'}。${playerColor===BLACK?'你先手':'AI先手'}。`;
            if (playerColor === WHITE && !gameOver && currentPlayer === BLACK) {
                scheduleAITurn();
            }
        }

        function clearThreats() {
            threatCells = [];
            threatFlash = 0;
            if (threatTimer) { clearInterval(threatTimer); threatTimer = null; }
            if (threatTimeout) { clearTimeout(threatTimeout); threatTimeout = null; }
        }

        // ---------- 落子逻辑 ----------
        function placePiece(row, col, color) {
            if (row<0||row>=SIZE||col<0||col>=SIZE) return false;
            if (board[row][col]!==EMPTY) return false;
            if (gameOver) return false;
            if (color !== currentPlayer) return false;

            board[row][col] = color;
            moveHistory.push({row, col, color});
            lastMove = {row, col};

            addEffect(row, col, 'place');
            playSound('place');

            if (checkWin(row, col, color)) {
                gameOver = true; winner = color;
                playSound('win');
                addEffect(row, col, 'win');
                updateUI(); drawBoard();
                showModal(color);
                return true;
            }
            if (isBoardFull()) {
                gameOver = true; winner = null;
                updateUI(); drawBoard();
                showModal(null);
                return true;
            }

            currentPlayer = (color===BLACK)?WHITE:BLACK;
            hintMove = null;
            clearThreats();
            updateUI();
            drawBoard();

            // 威胁检测（只检测AI威胁）
            if (!gameOver) {
                detectAIThreats();
            }
            return true;
        }

        function checkWin(row, col, color) {
            if (board[row][col] !== color) return false;
            for (const d of DIRS) {
                let count=1;
                for (let step=1; step<5; step++) {
                    const nr=row+d[0]*step, nc=col+d[1]*step;
                    if (nr<0||nr>=SIZE||nc<0||nc>=SIZE) break;
                    if (board[nr][nc]===color) count++; else break;
                }
                for (let step=1; step<5; step++) {
                    const nr=row-d[0]*step, nc=col-d[1]*step;
                    if (nr<0||nr>=SIZE||nc<0||nc>=SIZE) break;
                    if (board[nr][nc]===color) count++; else break;
                }
                if (count>=5) return true;
            }
            return false;
        }
        function checkGlobalWin(color) {
            for (let r=0; r<SIZE; r++) for (let c=0; c<SIZE; c++) if (board[r][c]===color && checkWin(r,c,color)) return true;
            return false;
        }

        // ---------- 只检测AI威胁 ----------
        function detectAIThreats() {
            const color = aiColor;
            const threats = [];
            const candidates = getCandidatePositions(board);
            for (const pos of candidates) {
                const r = pos[0], c = pos[1];
                board[r][c] = color;
                let four = false, three = false;
                for (const d of DIRS) {
                    let count = 1;
                    let openEnds = 0;
                    let rr = r + d[0], cc = c + d[1];
                    while (rr>=0 && rr<SIZE && cc>=0 && cc<SIZE && board[rr][cc]===color) { count++; rr+=d[0]; cc+=d[1]; }
                    if (rr>=0 && rr<SIZE && cc>=0 && cc<SIZE && board[rr][cc]===EMPTY) openEnds++;
                    rr = r - d[0]; cc = c - d[1];
                    while (rr>=0 && rr<SIZE && cc>=0 && cc<SIZE && board[rr][cc]===color) { count++; rr-=d[0]; cc-=d[1]; }
                    if (rr>=0 && rr<SIZE && cc>=0 && cc<SIZE && board[rr][cc]===EMPTY) openEnds++;

                    if (count >= 4 && openEnds >= 1) four = true;
                    if (count === 3 && openEnds === 2) three = true;
                }
                board[r][c] = EMPTY;
                if (four) threats.push({row:r, col:c, type:'four'});
                else if (three) threats.push({row:r, col:c, type:'three'});
            }

            // 只显示威胁，不显示玩家威胁
            if (threats.length > 0) {
                threatCells = threats;
                playSound('threat');
                // 闪烁效果
                if (threatTimer) clearInterval(threatTimer);
                threatFlash = 0;
                threatTimer = setInterval(() => {
                    threatFlash = (threatFlash + 0.1) % 1;
                    drawBoard();
                }, 150);

                // 提示信息
                const posStr = threats.map(t => `(${t.row+1},${t.col+1})`).join(' ');
                const typeStr = threats[0].type === 'four' ? '冲四' : '活三';
                thinkBox.textContent = `AI威胁 (${typeStr}) 位置: ${posStr}`;

                // 3秒后自动清除威胁标记
                if (threatTimeout) clearTimeout(threatTimeout);
                threatTimeout = setTimeout(() => {
                    clearThreats();
                    drawBoard();
                    if (!gameOver && currentPlayer === playerColor) {
                        thinkBox.textContent = `轮到你了，${playerColor===BLACK?'黑':'白'}棋。`;
                    }
                }, 3000);
            } else {
                clearThreats();
                if (!gameOver && currentPlayer === playerColor) {
                    thinkBox.textContent = `轮到你了，${playerColor===BLACK?'黑':'白'}棋。`;
                }
            }
        }

        // ---------- 悔棋 ----------
        function undoMove() {
            if (isThinking) return;
            if (moveHistory.length === 0) return;
            if (gameOver) { gameOver=false; winner=null; modalOverlay.classList.remove('show'); }

            let steps = 2;
            if (moveHistory.length === 1) steps = 1;
            const last = moveHistory[moveHistory.length-1];
            if (last.color === playerColor) steps = 1;

            for (let i=0; i<steps; i++) {
                if (moveHistory.length===0) break;
                const mv = moveHistory.pop();
                board[mv.row][mv.col] = EMPTY;
            }
            if (moveHistory.length>0) {
                const lastMv = moveHistory[moveHistory.length-1];
                lastMove = {row:lastMv.row, col:lastMv.col};
            } else lastMove = null;

            if (playerColor === BLACK) currentPlayer = (moveHistory.length%2===0)?BLACK:WHITE;
            else currentPlayer = (moveHistory.length%2===0)?WHITE:BLACK;

            gameOver = false; winner = null;
            hintMove = null;
            effects = []; shake=0; flash=0;
            zoomTarget=null; isZooming=false;
            confirmBtn.classList.remove('show');
            canvas.style.transform = '';
            modalOverlay.classList.remove('show');
            clearThreats();
            lastAIInfo = '';
            updateUI(); drawBoard();
            thinkBox.textContent = `悔棋成功，轮到${currentPlayer===playerColor?'你':'AI'}。`;
            if (!gameOver && currentPlayer === aiColor) {
                scheduleAITurn();
            }
        }

        // ---------- 特效系统 ----------
        function addEffect(row, col, type) {
            const pos = gridToPos(row, col);
            const x=pos.x, y=pos.y;
            const colors = ['#d4a843','#b8860b','#e8a87c','#7ec8e3','#b8a9e8','#f5d78e'];
            if (type === 'win') {
                const particles = [];
                for (let i=0; i<100; i++) {
                    const angle=Math.random()*6.28, speed=2+Math.random()*12;
                    particles.push({
                        x: x+(Math.random()-0.5)*16, y: y+(Math.random()-0.5)*16,
                        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed-0.5,
                        life: 20+Math.random()*45, maxLife:65,
                        size: 2+Math.random()*6, color: colors[~~(Math.random()*colors.length)]
                    });
                }
                effects.push({type:'particles', particles, life:55, maxLife:55});
                effects.push({type:'ring', x, y, radius:5, maxRadius:canvasPixelSize*0.48, life:45, maxLife:45, color:'rgba(184,134,11,0.35)'});
                shake=6; flash=0.18;
            } else if (type === 'place') {
                const particles = [];
                const count = 20+Math.floor(Math.random()*18);
                for (let i=0; i<count; i++) {
                    const angle=Math.random()*6.28, speed=1.5+Math.random()*5;
                    particles.push({
                        x: x+(Math.random()-0.5)*10, y: y+(Math.random()-0.5)*10,
                        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed-0.3,
                        life: 12+Math.random()*28, maxLife:40,
                        size: 1.5+Math.random()*3.5, color: colors[~~(Math.random()*colors.length)]
                    });
                }
                effects.push({type:'particles', particles, life:32, maxLife:32});
                effects.push({type:'glow', x, y, radius:PIECE_RADIUS*0.8, life:16, maxLife:16, color:'rgba(200,180,150,0.18)'});
                shake=2;
            } else if (type === 'hint') {
                const particles = [];
                for (let i=0; i<12; i++) {
                    const angle=Math.random()*6.28, speed=1+Math.random()*3;
                    particles.push({
                        x: x+(Math.random()-0.5)*8, y: y+(Math.random()-0.5)*8,
                        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed-0.2,
                        life: 8+Math.random()*18, maxLife:26,
                        size: 1.5+Math.random()*2.5, color: '#f5d78e'
                    });
                }
                effects.push({type:'particles', particles, life:22, maxLife:22});
                playSound('hint');
            }
        }
        function updateEffects() {
            for (let i=effects.length-1; i>=0; i--) {
                const e=effects[i];
                e.life--;
                if (e.life<=0) { effects.splice(i,1); continue; }
                if (e.type==='particles') {
                    const pArr=e.particles;
                    for (let j=pArr.length-1; j>=0; j--) {
                        const p=pArr[j];
                        p.x += p.vx; p.y += p.vy; p.vy += 0.08;
                        p.life--; p.size *= 0.97;
                        if (p.life<=0 || p.size<0.2) pArr.splice(j,1);
                    }
                    if (pArr.length===0) effects.splice(i,1);
                } else if (e.type==='ring') {
                    e.radius += (e.maxRadius-e.radius)*0.08;
                } else if (e.type==='glow') {
                    // 自然衰减
                }
            }
            shake = shake>0.1 ? shake*0.90 : 0;
            flash = flash>0.01 ? flash*0.92 : 0;
        }
        function drawEffects() {
            for (const e of effects) {
                const a = e.life/e.maxLife;
                ctx.save();
                if (e.type==='particles') {
                    for (const p of e.particles) {
                        if (p.life<=0) continue;
                        const pa = (p.life/p.maxLife)*0.85;
                        ctx.globalAlpha = pa;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, Math.max(0.3, p.size*(0.3+0.7*(p.life/p.maxLife))), 0, 6.28);
                        ctx.fillStyle = p.color;
                        ctx.shadowColor = p.color;
                        ctx.shadowBlur = 10;
                        ctx.fill();
                    }
                } else if (e.type==='ring') {
                    ctx.globalAlpha = a*0.45;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius, 0, 6.28);
                    ctx.strokeStyle = e.color;
                    ctx.lineWidth = 2+4*(1-a);
                    ctx.shadowColor = e.color;
                    ctx.shadowBlur = 18;
                    ctx.stroke();
                } else if (e.type==='glow') {
                    ctx.globalAlpha = a*0.40;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius*(0.6+0.4*(1-a)), 0, 6.28);
                    ctx.fillStyle = e.color;
                    ctx.shadowColor = e.color;
                    ctx.shadowBlur = 25;
                    ctx.fill();
                }
                ctx.restore();
            }
            if (flash>0.01) {
                ctx.fillStyle = `rgba(255,255,255,${flash})`;
                ctx.fillRect(0,0,canvas.width,canvas.height);
            }
        }

        // ---------- 绘制棋盘 (高DPI清晰) ----------
        function drawBoard() {
            const w=canvas.width, h=canvas.height;
            ctx.clearRect(0,0,w,h);

            // 棋盘背景
            const g = ctx.createRadialGradient(w*0.4, h*0.3, 0, w*0.5, h*0.5, w*0.8);
            g.addColorStop(0,'rgba(255,255,255,0.30)');
            g.addColorStop(1,'rgba(230,225,240,0.15)');
            ctx.fillStyle = g;
            ctx.fillRect(0,0,w,h);

            // 网格线
            ctx.strokeStyle = 'rgba(0,0,0,0.13)';
            ctx.lineWidth = 0.8 * scaleFactor;
            for (let i=0; i<SIZE; i++) {
                const p = PADDING + i*CELL_SIZE;
                ctx.beginPath(); ctx.moveTo(PADDING,p); ctx.lineTo(w-PADDING,p); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p,PADDING); ctx.lineTo(p,h-PADDING); ctx.stroke();
            }

            // 星位
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            const stars = starPositions(SIZE);
            for (const [r,c] of stars) {
                const pos = gridToPos(r,c);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, Math.max(3*scaleFactor, CELL_SIZE*0.10), 0, 6.28);
                ctx.fill();
            }

            // 棋子
            for (let r=0; r<SIZE; r++) {
                for (let c=0; c<SIZE; c++) {
                    if (board[r][c]===EMPTY) continue;
                    const pos = gridToPos(r,c);
                    const color = board[r][c];
                    const radius = PIECE_RADIUS;
                    const grd = ctx.createRadialGradient(
                        pos.x-radius*0.25, pos.y-radius*0.25, radius*0.08,
                        pos.x, pos.y, radius
                    );
                    if (color===BLACK) {
                        grd.addColorStop(0,'#777');
                        grd.addColorStop(0.5,'#333');
                        grd.addColorStop(1,'#000');
                    } else {
                        grd.addColorStop(0,'#fff');
                        grd.addColorStop(0.5,'#f0f0f0');
                        grd.addColorStop(1,'#b8b8b8');
                    }
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, radius, 0, 6.28);
                    ctx.fillStyle = grd;
                    ctx.shadowColor = 'rgba(0,0,0,0.25)';
                    ctx.shadowBlur = 6*scaleFactor;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // 高光
                    ctx.beginPath();
                    ctx.arc(pos.x - radius*(color===WHITE?0.15:0.12),
                            pos.y - radius*(color===WHITE?0.15:0.12),
                            radius*(color===WHITE?0.18:0.08), 0, 6.28);
                    ctx.fillStyle = color===WHITE?'rgba(255,255,255,0.7)':'rgba(255,255,255,0.20)';
                    ctx.fill();

                    // 编号
                    const idx = moveHistory.findIndex(m=>m.row===r && m.col===c)+1;
                    if (idx>0) {
                        ctx.font = `bold ${Math.min(CELL_SIZE*0.38, 15*scaleFactor)}px "华文楷体","KaiTi",sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.shadowColor = 'rgba(0,0,0,0.5)';
                        ctx.shadowBlur = 3*scaleFactor;
                        ctx.fillStyle = color===BLACK?'rgba(255,255,255,0.85)':'rgba(30,25,20,0.75)';
                        ctx.fillText(idx.toString(), pos.x, pos.y+1);
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // 最后一步高亮
            if (lastMove) {
                const pos = gridToPos(lastMove.row, lastMove.col);
                ctx.save();
                ctx.strokeStyle = 'rgba(255,215,0,0.5)';
                ctx.lineWidth = 2*scaleFactor;
                ctx.shadowColor = 'rgba(255,215,0,0.15)';
                ctx.shadowBlur = 10*scaleFactor;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, PIECE_RADIUS+4*scaleFactor, 0, 6.28);
                ctx.stroke();
                ctx.restore();
            }

            // 威胁标记 (只显示AI威胁，红色/橙色)
            if (threatCells.length > 0 && !gameOver) {
                const alpha = 0.5 + 0.5 * Math.sin(threatFlash * Math.PI * 2);
                for (const t of threatCells) {
                    const pos = gridToPos(t.row, t.col);
                    ctx.save();
                    ctx.globalAlpha = 0.7 * alpha;
                    const color = t.type === 'four' ? '#ff5722' : '#ff9800';
                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 30*scaleFactor;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, PIECE_RADIUS*0.9, 0, 6.28);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 3*scaleFactor;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, PIECE_RADIUS*1.15, 0, 6.28);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // 提示位置
            if (hintMove && !gameOver) {
                const pos = gridToPos(hintMove.row, hintMove.col);
                ctx.save();
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = '#4caf50';
                ctx.shadowColor = 'rgba(76,175,80,0.4)';
                ctx.shadowBlur = 18*scaleFactor;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, PIECE_RADIUS*0.35, 0, 6.28);
                ctx.fill();
                ctx.globalAlpha = 0.2;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, PIECE_RADIUS*0.65, 0, 6.28);
                ctx.fill();
                ctx.restore();
            }

            // 放大预览
            if (isZooming && zoomTarget) {
                const pos = gridToPos(zoomTarget.row, zoomTarget.col);
                ctx.save();
                ctx.strokeStyle = 'rgba(33,150,243,0.7)';
                ctx.lineWidth = 2.5*scaleFactor;
                ctx.shadowColor = 'rgba(33,150,243,0.2)';
                ctx.shadowBlur = 12*scaleFactor;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, PIECE_RADIUS*0.8, 0, 6.28);
                ctx.stroke();
                ctx.restore();
            }

            // 胜利连线
            if (gameOver && winner) {
                drawWinLine();
            }

            // 特效
            drawEffects();

            // 震动
            if (shake>0.1) {
                const dx=(Math.random()-0.5)*shake*1.2;
                const dy=(Math.random()-0.5)*shake*1.2;
                canvas.style.transform = `translate(${dx}px, ${dy}px)`;
            } else {
                if (!isZooming) canvas.style.transform = '';
            }
        }

        function drawWinLine() {
            for (let r=0; r<SIZE; r++) {
                for (let c=0; c<SIZE; c++) {
                    if (board[r][c]!==winner) continue;
                    for (const d of DIRS) {
                        let count=1;
                        let cells=[{r,c}];
                        for (let step=1; step<5; step++) {
                            const nr=r+d[0]*step, nc=c+d[1]*step;
                            if (nr<0||nr>=SIZE||nc<0||nc>=SIZE) break;
                            if (board[nr][nc]===winner) {count++; cells.push({r:nr,c:nc});} else break;
                        }
                        for (let step=1; step<5; step++) {
                            const nr=r-d[0]*step, nc=c-d[1]*step;
                            if (nr<0||nr>=SIZE||nc<0||nc>=SIZE) break;
                            if (board[nr][nc]===winner) {count++; cells.push({r:nr,c:nc});} else break;
                        }
                        if (count>=5) {
                            const first=cells[0], last=cells[cells.length-1];
                            const p1=gridToPos(first.r, first.c);
                            const p2=gridToPos(last.r, last.c);
                            ctx.save();
                            ctx.strokeStyle='rgba(255,215,0,0.8)';
                            ctx.lineWidth=4*scaleFactor;
                            ctx.shadowColor='rgba(255,215,0,0.3)';
                            ctx.shadowBlur=20*scaleFactor;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                            ctx.shadowBlur=0;
                            for (const cell of cells) {
                                const pos=gridToPos(cell.r, cell.c);
                                ctx.beginPath();
                                ctx.arc(pos.x, pos.y, 6*scaleFactor, 0, 6.28);
                                ctx.fillStyle='rgba(255,215,0,0.5)';
                                ctx.fill();
                            }
                            ctx.restore();
                            return;
                        }
                    }
                }
            }
        }

        function starPositions(size) {
            if (size===11) return [[2,2],[2,8],[8,2],[8,8],[5,5]];
            if (size===13) return [[3,3],[3,9],[9,3],[9,9],[6,6]];
            if (size===19) return [[3,3],[3,15],[15,3],[15,15],[9,9]];
            return [[3,3],[3,11],[11,3],[11,11],[7,7]];
        }

        // ---------- UI 更新 ----------

        function showModal(color) {

        // ---------- 尺寸调整 (高DPI适配) ----------
        function resizeCanvas() {
            const rect = wrap.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const displaySize = Math.min(rect.width - 12, 600);
            canvas.style.width = displaySize + 'px';
            canvas.style.height = displaySize + 'px';
            const pixelSize = displaySize * dpr;
            canvas.width = pixelSize;
            canvas.height = pixelSize;
            scaleFactor = dpr;
            canvasPixelSize = pixelSize;
            PADDING = 28 * dpr;
            CELL_SIZE = (pixelSize - PADDING*2) / (SIZE - 1);
            PIECE_RADIUS = CELL_SIZE * 0.44;
            ctx.setTransform(1,0,0,1,0,0);
            drawBoard();
        }

        // ================================================================
        //  AI 核心 (来自 ab威胁空间搜索)
        // ================================================================

        function getCandidatePositions(board) {
            const set = new Set();
            const range = 2;
            let hasStone = false;
            for (let r=0; r<SIZE; r++) {
                for (let c=0; c<SIZE; c++) {
                    if (board[r][c]!==EMPTY) {
                        hasStone = true;
                        for (let dr=-range; dr<=range; dr++) {
                            for (let dc=-range; dc<=range; dc++) {
                                const nr=r+dr, nc=c+dc;
                                if (nr>=0 && nr<SIZE && nc>=0 && nc<SIZE && board[nr][nc]===EMPTY) {
                                    set.add(nr*SIZE + nc);
                                }
                            }
                        }
                    }
                }
            }
            if (!hasStone) return [[Math.floor(SIZE/2), Math.floor(SIZE/2)]];
            const result = [];
            for (const key of set) {
                result.push([Math.floor(key/SIZE), key%SIZE]);
            }
            return result;
        }

        function evaluateDirection(board, row, col, color, dr, dc) {
            let count=1, openEnds=0;
            let r=row+dr, c=col+dc;
            while (r>=0 && r<SIZE && c>=0 && c<SIZE && board[r][c]===color) { count++; r+=dr; c+=dc; }
            if (r>=0 && r<SIZE && c>=0 && c<SIZE && board[r][c]===EMPTY) openEnds++;
            r=row-dr; c=col-dc;
            while (r>=0 && r<SIZE && c>=0 && c<SIZE && board[r][c]===color) { count++; r-=dr; c-=dc; }
            if (r>=0 && r<SIZE && c>=0 && c<SIZE && board[r][c]===EMPTY) openEnds++;

            if (count>=5) return 1000000;
            if (count===4) {
                if (openEnds===2) return 100000;
                if (openEnds===1) return 10000;
                return 0;
            }
            if (count===3) {
                if (openEnds===2) return 5000;
                if (openEnds===1) return 1000;
                return 0;
            }
            if (count===2) {
                if (openEnds===2) return 500;
                if (openEnds===1) return 100;
                return 0;
            }
            if (count===1) {
                if (openEnds===2) return 10;
                return 0;
            }
            return 0;
        }

        function evaluatePoint(board, row, col, color) {
            if (board[row][col]!==EMPTY) return 0;
            let score=0;
            for (const d of DIRS) {
                score += evaluateDirection(board,row,col,color,d[0],d[1]);
            }
            return score;
        }

        function evaluateBoard(board, aiColor) {
            const playerColor = (aiColor===BLACK)?WHITE:BLACK;
            const candidates = getCandidatePositions(board);
            let aiScore=0, playerScore=0;
            for (const pos of candidates) {
                aiScore += evaluatePoint(board,pos[0],pos[1],aiColor);
                playerScore += evaluatePoint(board,pos[0],pos[1],playerColor);
            }
            if (checkGlobalWin(aiColor)) return 9999999;
            if (checkGlobalWin(playerColor)) return -9999999;
            return aiScore - playerScore*1.1;
        }

        function orderMoves(board, moves, color, opponentColor) {
            const scored = moves.map(pos => {
                const myScore = evaluatePoint(board,pos[0],pos[1],color);
                const oppScore = evaluatePoint(board,pos[0],pos[1],opponentColor);
                const total = myScore + oppScore*1.3;
                return {pos, total};
            });
            scored.sort((a,b)=>b.total-a.total);
            return scored.map(item=>item.pos);
        }

        function alphaBetaSearch(board, depth, alpha, beta, isMaximizing, aiColor, currentDepth) {
            const playerColor = (aiColor===BLACK)?WHITE:BLACK;
            const color = isMaximizing?aiColor:playerColor;
            const opponent = (color===BLACK)?WHITE:BLACK;

            if (checkGlobalWin(aiColor)) return 9999999 - currentDepth;
            if (checkGlobalWin(playerColor)) return -9999999 + currentDepth;
            if (isBoardFull()) return 0;
            if (depth===0) return evaluateBoard(board, aiColor);

            let candidates = getCandidatePositions(board);
            if (candidates.length===0) return 0;
            candidates = orderMoves(board, candidates, color, opponent);

            if (isMaximizing) {
                let maxEval = -Infinity;
                const topN = Math.min(candidates.length, 8);
                for (let i=0; i<topN; i++) {
                    const pos = candidates[i];
                    board[pos[0]][pos[1]] = aiColor;
                    const val = alphaBetaSearch(board, depth-1, alpha, beta, false, aiColor, currentDepth+1);
                    board[pos[0]][pos[1]] = EMPTY;
                    maxEval = Math.max(maxEval, val);
                    alpha = Math.max(alpha, val);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                const topN = Math.min(candidates.length, 8);
                for (let i=0; i<topN; i++) {
                    const pos = candidates[i];
                    board[pos[0]][pos[1]] = playerColor;
                    const val = alphaBetaSearch(board, depth-1, alpha, beta, true, aiColor, currentDepth+1);
                    board[pos[0]][pos[1]] = EMPTY;
                    minEval = Math.min(minEval, val);
                    beta = Math.min(beta, val);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function calcDynamicDepth(minDepth, maxDepth) {
            const total = SIZE*SIZE;
            const filled = countPieces();
            const fillRate = filled/total;
            let depth = minDepth + (maxDepth-minDepth)*fillRate*1.0;

            const candidates = getCandidatePositions(board);
            let threatScore = 0;
            for (const pos of candidates) {
                const s = evaluatePoint(board,pos[0],pos[1],aiColor);
                if (s>=10000) threatScore=Math.max(threatScore,3);
                else if (s>=5000) threatScore=Math.max(threatScore,2);
                else if (s>=1000) threatScore=Math.max(threatScore,1);
            }
            depth += threatScore*0.5;

            if (hasDirectWin(aiColor)) {
                depth = Math.min(depth, minDepth+1);
            }
            depth = Math.round(Math.min(maxDepth, Math.max(minDepth, depth)));
            return depth;
        }

        function hasDirectWin(color) {
            const candidates = getCandidatePositions(board);
            for (const pos of candidates) {
                board[pos[0]][pos[1]] = color;
                const win = checkWin(pos[0],pos[1],color);
                board[pos[0]][pos[1]] = EMPTY;
                if (win) return true;
            }
            return false;
        }

        function getAIMove(board, aiColor) {
            const candidates = getCandidatePositions(board);
            if (candidates.length===0) return null;
            const playerColor = (aiColor===BLACK)?WHITE:BLACK;

            // 1. 直接获胜
            for (const pos of candidates) {
                board[pos[0]][pos[1]] = aiColor;
                if (checkWin(pos[0],pos[1],aiColor)) {
                    board[pos[0]][pos[1]] = EMPTY;
                    return {row:pos[0], col:pos[1], score:9999999};
                }
                board[pos[0]][pos[1]] = EMPTY;
            }

            // 2. 防守直接获胜
            for (const pos of candidates) {
                board[pos[0]][pos[1]] = playerColor;
                if (checkWin(pos[0],pos[1],playerColor)) {
                    board[pos[0]][pos[1]] = EMPTY;
                    return {row:pos[0], col:pos[1], score:-9999999};
                }
                board[pos[0]][pos[1]] = EMPTY;
            }

            // 3. 动态深度
            const depth = calcDynamicDepth(depthMin, depthMax);

            // 4. 排序走法
            const ordered = orderMoves(board, candidates, aiColor, playerColor);
            const topN = Math.min(ordered.length, 8);

            let bestScore = -Infinity;
            let bestMove = {row:ordered[0][0], col:ordered[0][1], score:-Infinity};
            let topMoves = [];

            for (let i=0; i<topN; i++) {
                const pos = ordered[i];
                board[pos[0]][pos[1]] = aiColor;
                const score = alphaBetaSearch(board, depth-1, -Infinity, Infinity, false, aiColor, 1);
                board[pos[0]][pos[1]] = EMPTY;
                topMoves.push({row:pos[0], col:pos[1], score});
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = {row:pos[0], col:pos[1], score};
                }
            }

            topMoves.sort((a,b)=>b.score-a.score);
            const top3 = topMoves.slice(0,3).map(m=>`(${m.row+1},${m.col+1})[${m.score}]`).join(' ');
            lastAIInfo = `最佳走法 (${bestMove.row+1},${bestMove.col+1}) 评分 ${bestScore} | 候选: ${top3}`;

            return bestMove;
        }

        // ---------- AI 走子调度 (轻量指示) ----------
        function scheduleAITurn() {
            if (isThinking) return;
            if (gameOver) return;
            if (currentPlayer !== aiColor) return;

            isThinking = true;
            thinkingIndicator.classList.add('show');
            updateUI();

            requestAnimationFrame(() => {
                setTimeout(() => {
                    const candidates = getCandidatePositions(board);
                    if (candidates.length === 0) {
                        isThinking = false;
                        thinkingIndicator.classList.remove('show');
                        updateUI();
                        return;
                    }

                    const move = getAIMove(board, aiColor);
                    if (move) {
                        if (isZooming) cancelZoom();
                        placePiece(move.row, move.col, aiColor);
                        if (!gameOver) {
                            thinkBox.textContent = `AI 落子 (${move.row+1}, ${move.col+1})。${lastAIInfo}`;
                        } else {
                            thinkBox.textContent = `AI 落子 (${move.row+1}, ${move.col+1})。${lastAIInfo}`;
                        }
                    }

                    isThinking = false;
                    thinkingIndicator.classList.remove('show');
                    updateUI();
                    drawBoard();

                    if (gameOver) {
                        if (winner === playerColor) thinkBox.textContent = `你赢了！ ${lastAIInfo}`;
                        else if (winner === aiColor) thinkBox.textContent = `AI 赢了。 ${lastAIInfo}`;
                        else if (winner === null && isBoardFull()) thinkBox.textContent = '平局。';
                    }
                }, 12);
            });
        }

        // ---------- 放大模式 ----------
        function applyZoom(row, col) {
            if (isThinking || gameOver) return;
            if (board[row][col] !== EMPTY) return;
            if (currentPlayer !== playerColor) return;

            zoomTarget = {row, col};
            isZooming = true;
            const pos = gridToPos(row, col);
            const px = (pos.x / canvas.width) * 100;
            const py = (pos.y / canvas.height) * 100;
            canvas.style.transformOrigin = `${px}% ${py}%`;
            canvas.style.transform = 'scale(1.9)';
            confirmBtn.classList.add('show');
            drawBoard();
            modeHint.textContent = '点击「确认落子」';
            thinkBox.textContent = `放大位置 (${row+1}, ${col+1})，请确认落子。`;
        }

        function confirmZoomPlace() {
            if (!isZooming || !zoomTarget) return;
            if (isThinking || gameOver) return;
            if (currentPlayer !== playerColor) return;
            const {row, col} = zoomTarget;
            if (board[row][col] !== EMPTY) { cancelZoom(); return; }

            const success = placePiece(row, col, playerColor);
            cancelZoom();
            if (success) {
                drawBoard();
                if (!gameOver && currentPlayer === aiColor) {
                    thinkBox.textContent = 'AI 思考中 …';
                    scheduleAITurn();
                } else if (!gameOver) {
                    thinkBox.textContent = `落子 (${row+1}, ${col+1})，轮到你了。`;
                }
            }
        }

        function cancelZoom() {
            isZooming = false;
            zoomTarget = null;
            confirmBtn.classList.remove('show');
            canvas.style.transform = '';
            drawBoard();
            if (!gameOver && currentPlayer === playerColor) {
                modeHint.textContent = touchMode === 'direct' ? '点击棋盘落子' : '点击放大，再确认';
                thinkBox.textContent = `轮到你了，${playerColor === BLACK ? '黑' : '白'}棋。`;
            }
        }

        // ---------- 交互处理 ----------
        function handleInteraction(e) {
            if (isThinking || gameOver) return;
            if (currentPlayer !== playerColor) return;

            const {x, y} = getCanvasCoords(e);
            const grid = posToGrid(x, y);
            if (!grid) {
                if (isZooming) cancelZoom();
                return;
            }
            const {row, col} = grid;
            if (board[row][col] !== EMPTY) {
                if (isZooming) cancelZoom();
                return;
            }

            if (touchMode === 'direct') {
                if (isZooming) cancelZoom();
                const success = placePiece(row, col, playerColor);
                if (success) {
                    drawBoard();
                    if (!gameOver && currentPlayer === aiColor) {
                        thinkBox.textContent = 'AI 思考中 …';
                        scheduleAITurn();
                    } else if (!gameOver) {
                        thinkBox.textContent = `落子 (${row+1}, ${col+1})，轮到你了。`;
                    }
                }
            } else {
                if (isZooming && zoomTarget && zoomTarget.row === row && zoomTarget.col === col) {
                    confirmZoomPlace();
                    return;
                }
                applyZoom(row, col);
            }
        }

        // ---------- 推荐 ----------
        function showHint() {
            if (isThinking || gameOver) return;
            if (currentPlayer !== playerColor) {
                thinkBox.textContent = '请等待你的回合。';
                return;
            }
            const candidates = getCandidatePositions(board);
            if (candidates.length === 0) {
                thinkBox.textContent = '棋盘已满。';
                return;
            }

            const tempBoard = board.map(row=>[...row]);
            const hintDepth = Math.min(Math.max(depthMin, 2), 4);
            const move = getAIMove(tempBoard, playerColor);
            if (move) {
                hintMove = {row: move.row, col: move.col};
                addEffect(move.row, move.col, 'hint');
                drawBoard();
                thinkBox.textContent = `推荐走法 (${move.row+1}, ${move.col+1})，评分 ${move.score}。${lastAIInfo}`;
                setTimeout(() => {
                    hintMove = null;
                    drawBoard();
                    if (!gameOver && currentPlayer === playerColor) {
                        thinkBox.textContent = `轮到你了，${playerColor === BLACK ? '黑' : '白'}棋。`;
                    }
                }, 4000);
            } else {
                thinkBox.textContent = '无法计算推荐走法。';
            }
        }

        // ---------- 重置 ----------
        function restartGame() {
            if (isThinking) return;
            modalOverlay.classList.remove('show');
            initBoard();
            resizeCanvas();
            updateUI();
            thinkBox.textContent = `新局开始，你执${playerColor === BLACK ? '黑' : '白'}。`;
            if (playerColor === WHITE && !gameOver && currentPlayer === BLACK) {
                scheduleAITurn();
            }
        }

        // ---------- 切换执子 ----------
        function setPlayerColor(color) {
            if (isThinking) return;
            if (color === playerColor) return;
            playerColor = color;
            aiColor = (color === BLACK) ? WHITE : BLACK;
            btnBlack.classList.toggle('active', color === BLACK);
            btnWhite.classList.toggle('active', color === WHITE);
            restartGame();
        }

        // ---------- 切换难度 ----------
        function setDifficulty(diffLabel) {
            const map = {
                'easy': {min:2, max:4},
                'medium': {min:4, max:8},
                'hard': {min:6, max:12},
                'expert': {min:8, max:16}
            };
            const cfg = map[diffLabel] || map['medium'];
            depthMin = cfg.min;
            depthMax = cfg.max;
            diffBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === diffLabel);
            });
            thinkBox.textContent = `难度: ${diffLabel} (搜索深度 ${depthMin}-${depthMax})`;
            restartGame();
        }

        // ---------- 切换棋盘尺寸 ----------
        function setSize(size) {
            if (size === SIZE) return;
            SIZE = size;
            sizeBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.size) === size);
            });
            restartGame();
            resizeCanvas();
            thinkBox.textContent = `棋盘 ${SIZE}x${SIZE}`;
        }

        // ---------- 切换触控模式 ----------
        function setTouchMode(mode) {
            touchMode = mode;
            touchBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            if (isZooming) cancelZoom();
            modeHint.textContent = mode === 'direct' ? '点击棋盘落子' : '点击放大，再确认';
            thinkBox.textContent = `触控模式: ${mode === 'direct' ? '直接' : '放大'}`;
        }

        // ================================================================
        //  循环 (特效更新)
        // ================================================================

        function loop() {
            if (effects.length > 0 || shake > 0.1 || flash > 0.01) {
                updateEffects();
                drawBoard();
            }
            requestAnimationFrame(loop);
        }

        // ================================================================
        //  初始化
        // ================================================================

        function init() {
            playerColor = BLACK;
            aiColor = WHITE;
            btnBlack.classList.add('active');
            btnWhite.classList.remove('active');

            const defaultDiff = document.querySelector('#diffGroup .btn-opt[data-diff="medium"]');
            if (defaultDiff) { defaultDiff.classList.add('active'); depthMin=4; depthMax=8; }

            const defaultSize = document.querySelector('#sizeGroup .btn-opt[data-size="13"]');
            if (defaultSize) { defaultSize.classList.add('active'); SIZE=13; }

            const defaultTouch = document.querySelector('#touchGroup .btn-opt[data-mode="direct"]');
            if (defaultTouch) { defaultTouch.classList.add('active'); touchMode='direct'; }

            initBoard();
            resizeCanvas();

            // ---- 事件绑定 ----
            canvas.addEventListener('click', handleInteraction);
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleInteraction(e);
            }, { passive: false });

            confirmBtn.addEventListener('click', confirmZoomPlace);

            btnBlack.addEventListener('click', ()=>setPlayerColor(BLACK));
            btnWhite.addEventListener('click', ()=>setPlayerColor(WHITE));

            diffBtns.forEach(btn => {
                btn.addEventListener('click', ()=>setDifficulty(btn.dataset.diff));
            });

            sizeBtns.forEach(btn => {
                btn.addEventListener('click', ()=>setSize(parseInt(btn.dataset.size)));
            });

            touchBtns.forEach(btn => {
                btn.addEventListener('click', ()=>setTouchMode(btn.dataset.mode));
            });

            undoBtn.addEventListener('click', undoMove);
            restartBtn.addEventListener('click', restartGame);
            modalRestartBtn.addEventListener('click', restartGame);
            hintBtn.addEventListener('click', showHint);

            modalOverlay.addEventListener('click', (e) => {
                if (e.target === e.currentTarget) modalOverlay.classList.remove('show');
            });

            window.addEventListener('resize', resizeCanvas);
            setTimeout(resizeCanvas, 50);

            loop();

            thinkBox.textContent = '欢迎，你执黑先行。中等难度。';
            updateUI();

            if (playerColor === WHITE && !gameOver && currentPlayer === BLACK) {
                scheduleAITurn();
            }
        }

        if (document.readyState === 'complete') {
            init();
        } else {
            window.addEventListener('load', init);
        }

    })();
</script>
</body>
</html>
