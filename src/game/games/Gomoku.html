<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>五子棋</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #e8e0d8;
        }
        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }
        .container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ===== 封面 ===== */
        #cover {
            z-index: 100;
            background: rgba(245, 242, 237, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            flex-direction: column;
            gap: 28px;
            padding: 40px 48px;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #cover .title {
            font-size: 48px;
            font-weight: 300;
            color: #3d342c;
            letter-spacing: 12px;
            font-family: 'Times New Roman', serif;
        }
        #cover .subtitle {
            font-size: 14px;
            color: #8a7e72;
            letter-spacing: 6px;
            font-weight: 300;
            margin-top: -8px;
        }
        .cover-btns {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .cover-btn {
            padding: 12px 36px;
            font-size: 16px;
            font-weight: 500;
            border: 1px solid rgba(200, 190, 176, 0.5);
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            color: #3d342c;
            letter-spacing: 1px;
            font-family: inherit;
        }
        .cover-btn:hover {
            background: #3d342c;
            color: #f5f0ea;
            border-color: #3d342c;
        }
        .cover-btn:active {
            transform: scale(0.96);
        }
        .settings {
            display: none;
            flex-direction: column;
            gap: 16px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(16px);
            padding: 24px 32px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            min-width: 220px;
            align-items: center;
            margin-top: 6px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        .settings.show {
            display: flex;
        }
        .settings .row {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .settings label {
            color: #3d342c;
            font-size: 14px;
        }
        .settings select {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(200, 190, 176, 0.5);
            background: rgba(255, 255, 255, 0.4);
            color: #3d342c;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            min-width: 100px;
            backdrop-filter: blur(4px);
        }
        .settings select:focus {
            border-color: #8a7e72;
        }
        .settings .start-btn {
            padding: 10px 32px;
            font-size: 16px;
            font-weight: 500;
            border: 1px solid rgba(200, 190, 176, 0.5);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.3);
            color: #3d342c;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            width: 100%;
            letter-spacing: 1px;
            margin-top: 4px;
            backdrop-filter: blur(4px);
        }
        .settings .start-btn:hover {
            background: #3d342c;
            color: #f5f0ea;
            border-color: #3d342c;
        }

        /* ===== 游戏界面 ===== */
        #game {
            z-index: 50;
            background: rgba(240, 235, 229, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            flex-direction: column;
            align-items: center;
            padding: 16px 20px 20px 20px;
            height: 100%;
            width: 100%;
            overflow: hidden;
            gap: 10px;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 660px;
            padding: 6px 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 6px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }
        .game-header .info {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            padding: 2px 4px;
        }
        .game-header .info .badge {
            font-weight: 400;
            color: #5a4e42;
            font-size: 14px;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 12px;
            border-radius: 30px;
        }
        .game-header .info .turn-indicator {
            font-weight: 500;
            font-size: 14px;
            color: #3d342c;
            min-width: 80px;
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 14px;
            border-radius: 30px;
        }
        .game-header .info .turn-indicator.player-turn {
            color: #1a1a1a;
        }
        .game-header .info .turn-indicator.computer-turn {
            color: #b09878;
        }
        .game-header .info .move-count {
            font-weight: 400;
            color: #7a6e62;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 12px;
            border-radius: 30px;
        }
        .game-header .difficulty-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .game-header .difficulty-group label {
            font-size: 13px;
            color: #5a4e42;
        }
        .game-header .difficulty-group select {
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid rgba(200, 190, 180, 0.3);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            color: #3d342c;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .game-header .difficulty-group select:focus {
            border-color: #8a7e72;
        }

        .board-wrapper {
            position: relative;
            border-radius: 24px;
            border: 1px solid rgba(200, 190, 180, 0.2);
            background: rgba(248, 244, 238, 0.6);
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            touch-action: none;
            width: 100%;
            max-width: 660px;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            aspect-ratio: 1 / 1;
        }
        #boardCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: rgba(248, 244, 238, 0.3);
            cursor: pointer;
            touch-action: none;
            position: relative;
            z-index: 2;
            border-radius: 24px;
        }
        #sceneCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            border-radius: 24px;
            background: rgba(248, 244, 238, 0.3);
        }
        #effectCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            border-radius: 24px;
        }

        .bottom-bar {
            width: 100%;
            max-width: 660px;
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            padding: 4px 0;
            justify-content: space-between;
            align-items: center;
        }
        .bottom-bar .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .bottom-bar button {
            padding: 6px 16px;
            min-height: 36px;
            border: 1px solid rgba(200, 190, 180, 0.3);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            color: #3d342c;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .bottom-bar button:hover {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(160, 150, 140, 0.5);
        }
        .bottom-bar button:active {
            transform: scale(0.94);
        }
        .bottom-bar button.primary {
            background: #3d342c;
            color: #f5f0ea;
            border-color: #3d342c;
            box-shadow: 0 4px 16px rgba(61, 52, 44, 0.12);
        }
        .bottom-bar button.primary:hover {
            background: #5a4e42;
            border-color: #5a4e42;
        }
        .bottom-bar button.hint-btn {
            border-color: rgba(200, 180, 160, 0.4);
            background: rgba(200, 180, 160, 0.12);
        }
        .bottom-bar button.hint-btn:hover {
            background: rgba(200, 180, 160, 0.25);
        }
        .bottom-bar select {
            padding: 6px 12px;
            min-height: 36px;
            border-radius: 30px;
            border: 1px solid rgba(200, 190, 180, 0.3);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            color: #3d342c;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            appearance: auto;
        }
        .bottom-bar select:focus {
            border-color: #8a7e72;
        }

        .replay-controls {
            display: none;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 2px 8px;
            border-radius: 30px;
            border: 1px solid rgba(200, 190, 180, 0.2);
        }
        .replay-controls button {
            min-width: 32px;
            padding: 4px 8px;
            font-size: 14px;
            border-radius: 30px;
            border: none;
            background: transparent;
            color: #3d342c;
            min-height: 30px;
        }
        .replay-controls button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .replay-controls span {
            font-size: 13px;
            color: #5a4e42;
            min-width: 36px;
            text-align: center;
        }

        .info-panel {
            display: none;
        }

        /* ===== 模态弹窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal-box {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 40px 48px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.08);
        }
        .modal-box .modal-title {
            font-size: 28px;
            font-weight: 500;
            color: #3d342c;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .modal-box .modal-title.win {
            color: #2a7a2a;
        }
        .modal-box .modal-title.lose {
            color: #8a2a2a;
        }
        .modal-box .modal-sub {
            font-size: 16px;
            color: #5a4e42;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .modal-box .modal-btn {
            padding: 10px 36px;
            border: none;
            border-radius: 40px;
            background: #3d342c;
            color: #f5f0ea;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            box-shadow: 0 4px 16px rgba(61, 52, 44, 0.15);
        }
        .modal-box .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(61, 52, 44, 0.2);
        }
        .modal-box .modal-btn:active {
            transform: scale(0.96);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            #game { padding: 10px 12px 16px 12px; gap: 8px; }
            .game-header { padding: 4px 10px; border-radius: 30px; }
            .game-header .info .badge { font-size: 12px; padding: 1px 10px; }
            .game-header .info .turn-indicator { font-size: 13px; padding: 1px 12px; min-width: 70px; }
            .game-header .info .move-count { font-size: 12px; padding: 1px 10px; }
            .game-header .difficulty-group label { font-size: 12px; }
            .game-header .difficulty-group select { font-size: 12px; padding: 3px 8px; }
            .bottom-bar button { font-size: 13px; padding: 4px 12px; min-height: 34px; }
            .bottom-bar select { font-size: 13px; padding: 4px 10px; min-height: 34px; }
            .modal-box { padding: 32px 28px; }
            .modal-box .modal-title { font-size: 24px; }
        }
        @media (max-width: 480px) {
            #game { padding: 6px 8px 12px 8px; gap: 6px; }
            .game-header { flex-direction: column; align-items: stretch; gap: 2px; border-radius: 24px; padding: 4px 8px; }
            .game-header .info { justify-content: center; gap: 8px; }
            .game-header .info .badge { font-size: 11px; }
            .game-header .info .turn-indicator { font-size: 12px; min-width: 60px; }
            .game-header .info .move-count { font-size: 11px; }
            .game-header .difficulty-group { justify-content: center; }
            .bottom-bar { flex-direction: column; gap: 4px; align-items: stretch; }
            .bottom-bar .btn-group { justify-content: center; }
            .bottom-bar button { font-size: 12px; padding: 4px 10px; min-height: 32px; flex: 0 1 auto; }
            .bottom-bar select { font-size: 12px; padding: 4px 10px; min-height: 32px; }
            .modal-box { padding: 24px 20px; }
            .modal-box .modal-title { font-size: 20px; }
            .modal-box .modal-sub { font-size: 14px; }
        }
        @media (max-height: 640px) {
            #game { padding: 6px 10px 10px 10px; gap: 5px; }
            .game-header { padding: 2px 8px; border-radius: 24px; }
            .game-header .info .badge { font-size: 11px; }
            .game-header .info .turn-indicator { font-size: 12px; min-width: 60px; }
            .game-header .info .move-count { font-size: 11px; }
            .bottom-bar button { font-size: 12px; padding: 4px 10px; min-height: 30px; }
            .bottom-bar select { font-size: 12px; padding: 4px 8px; min-height: 30px; }
        }
    </style>
</head>
<body>

    <!-- ===== 封面 ===== -->
    <div id="cover" class="container">
        <div class="title">五子棋</div>
        <div class="subtitle">· 雅智 ·</div>
        <div class="cover-btns">
            <button class="cover-btn" id="btnPvP">玩家对战</button>
            <button class="cover-btn" id="btnPvE">人机对战</button>
        </div>
        <div class="settings" id="settingsPanel">
            <div class="row">
                <label>难度</label>
                <select id="difficultySelect">
                    <option value="easy">简单</option>
                    <option value="medium" selected>中等</option>
                    <option value="hard">困难</option>
                </select>
            </div>
            <div class="row">
                <label>先后手</label>
                <select id="firstSelect">
                    <option value="player">玩家先手</option>
                    <option value="ai">AI 先手</option>
                </select>
            </div>
            <button class="start-btn" id="startGameBtn">开始对局</button>
        </div>
    </div>

    <!-- ===== 游戏界面 ===== -->
    <div id="game" class="container hidden">
        <div class="game-header">
            <div class="info">
                <span class="badge" id="modeLabel">人机对战</span>
                <span class="turn-indicator player-turn" id="turnIndicator">玩家(黑)走</span>
                <span class="move-count" id="moveCount">步数 0</span>
            </div>
            <div class="difficulty-group">
                <label>难度</label>
                <select id="gameDifficultySelect">
                    <option value="easy">简单</option>
                    <option value="medium" selected>中等</option>
                    <option value="hard">困难</option>
                </select>
            </div>
        </div>

        <div class="board-wrapper">
            <canvas id="sceneCanvas"></canvas>
            <canvas id="effectCanvas"></canvas>
            <canvas id="boardCanvas"></canvas>
        </div>

        <div class="bottom-bar">
            <div class="btn-group">
                <button id="undoBtn" class="primary">悔棋</button>
                <button id="hintBtn" class="hint-btn">提示</button>
                <button id="restartBtn">重开</button>
            </div>
            <div class="btn-group">
                <button id="replayBtn">复盘</button>
                <select id="boardSizeSelect">
                    <option value="13">13×13</option>
                    <option value="15" selected>15×15</option>
                    <option value="17">17×17</option>
                    <option value="19">19×19</option>
                </select>
                <button id="menuBtn">菜单</button>
            </div>
            <div class="replay-controls" id="replayControls">
                <button id="replayPrev">‹</button>
                <span id="replayIndex">0/0</span>
                <button id="replayNext">›</button>
                <button id="replayAuto">▶</button>
                <button id="replayExit">✕</button>
            </div>
        </div>

        <div class="info-panel" id="infoPanel">就绪</div>
    </div>

    <!-- ===== 模态弹窗 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">胜利</div>
            <div class="modal-sub" id="modalSub">恭喜你获得胜利！</div>
            <button class="modal-btn" id="modalBtn">确定</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  五子棋 · 雅智版 (棋力增强 · 评分精细化 + 攻防平衡)
        // ================================================================

        // ---------- DOM ----------
        const cover = document.getElementById('cover');
        const game = document.getElementById('game');
        const btnPvP = document.getElementById('btnPvP');
        const btnPvE = document.getElementById('btnPvE');
        const settingsPanel = document.getElementById('settingsPanel');
        const difficultySelect = document.getElementById('difficultySelect');
        const firstSelect = document.getElementById('firstSelect');
        const startGameBtn = document.getElementById('startGameBtn');
        const boardCanvas = document.getElementById('boardCanvas');
        const sceneCanvas = document.getElementById('sceneCanvas');
        const effectCanvas = document.getElementById('effectCanvas');
        const turnIndicator = document.getElementById('turnIndicator');
        const moveCountEl = document.getElementById('moveCount');
        const modeLabel = document.getElementById('modeLabel');
        const restartBtn = document.getElementById('restartBtn');
        const menuBtn = document.getElementById('menuBtn');
        const undoBtn = document.getElementById('undoBtn');
        const hintBtn = document.getElementById('hintBtn');
        const replayBtn = document.getElementById('replayBtn');
        const boardSizeSelect = document.getElementById('boardSizeSelect');
        const replayControls = document.getElementById('replayControls');
        const replayPrev = document.getElementById('replayPrev');
        const replayNext = document.getElementById('replayNext');
        const replayIndex = document.getElementById('replayIndex');
        const replayAuto = document.getElementById('replayAuto');
        const replayExit = document.getElementById('replayExit');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalSub = document.getElementById('modalSub');
        const modalBtn = document.getElementById('modalBtn');

        const ctx = boardCanvas.getContext('2d');
        const sctx = sceneCanvas.getContext('2d');
        const ectx = effectCanvas.getContext('2d');

        // ---------- 尺寸 ----------
        let canvasSize = 560;
        const boardPadding = 36;
        let cellSize = 0;
        let boardSize = 15;
        let dpr = 1;

        // ---------- 状态 ----------
        let gameMode = 'pvp';
        let currentPlayer = 1;
        let board = [];
        let stepBoard = [];
        let moveHistory = [];
        let gameOver = false;
        let winner = 0;
        let moveCount = 0;
        let isAIThinking = false;
        let aiDifficulty = 'medium';
        let aiFirst = false;
        let aiTimer = null;
        let undoStack = [];
        let replayMode = false;
        let replayStep = 0;
        let replayAutoTimer = null;
        let replayHistory = [];
        let audioCtx = null;
        let hintPosition = null;

        const FIXED_BG = '#f8f4ee';

        // ---------- 初始化 ----------
        function initSizes() {
            const rect = boardCanvas.getBoundingClientRect();
            const cssWidth = rect.width || 560;
            const cssHeight = rect.height || 560;
            canvasSize = Math.min(cssWidth, cssHeight);
            dpr = window.devicePixelRatio || 1;
            boardCanvas.width = canvasSize * dpr;
            boardCanvas.height = canvasSize * dpr;
            sceneCanvas.width = canvasSize * dpr;
            sceneCanvas.height = canvasSize * dpr;
            effectCanvas.width = canvasSize * dpr;
            effectCanvas.height = canvasSize * dpr;
            boardCanvas.style.width = canvasSize + 'px';
            boardCanvas.style.height = canvasSize + 'px';
            sceneCanvas.style.width = canvasSize + 'px';
            sceneCanvas.style.height = canvasSize + 'px';
            effectCanvas.style.width = canvasSize + 'px';
            effectCanvas.style.height = canvasSize + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            sctx.setTransform(1, 0, 0, 1, 0, 0);
            sctx.scale(dpr, dpr);
            ectx.setTransform(1, 0, 0, 1, 0, 0);
            ectx.scale(dpr, dpr);
            cellSize = (canvasSize - boardPadding * 2) / (boardSize - 1);
        }

        function initBoard() {
            board = [];
            stepBoard = [];
            for (let i = 0; i < boardSize; i++) {
                board.push(new Array(boardSize).fill(0));
                stepBoard.push(new Array(boardSize).fill(0));
            }
            moveHistory = [];
            undoStack = [];
            moveCount = 0;
            gameOver = false;
            winner = 0;
            currentPlayer = 1;
            isAIThinking = false;
            hintPosition = null;
            clearReplay();
            updateTurnIndicator();
            moveCountEl.textContent = '步数 0';
            ectx.clearRect(0, 0, canvasSize, canvasSize);
            if (aiTimer) { clearTimeout(aiTimer);
                aiTimer = null; }
            modalOverlay.classList.remove('show');
        }

        // ================================================================
        //  弹窗
        // ================================================================
        function showModal(title, sub, type) {
            modalTitle.textContent = title;
            modalTitle.className = 'modal-title ' + (type || 'win');
            modalSub.textContent = sub;
            modalOverlay.classList.add('show');
        }

        // ================================================================
        //  棋盘绘制 (同上)
        // ================================================================
        function drawBoard() {
            const w = canvasSize,
                h = canvasSize;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = FIXED_BG;
            ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = 'rgba(120, 108, 96, 0.45)';
            ctx.lineWidth = 1.2;
            for (let i = 0; i < boardSize; i++) {
                const x = boardPadding + i * cellSize,
                    y = boardPadding + i * cellSize;
                ctx.beginPath();
                ctx.moveTo(boardPadding, y);
                ctx.lineTo(w - boardPadding, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, boardPadding);
                ctx.lineTo(x, h - boardPadding);
                ctx.stroke();
            }
            const starPos = [
                [3, 3],
                [3, boardSize - 4],
                [boardSize - 4, 3],
                [boardSize - 4, boardSize - 4],
                [Math.floor(boardSize / 2), Math.floor(boardSize / 2)]
            ];
            ctx.fillStyle = 'rgba(90,78,66,0.6)';
            for (const [r, c] of starPos) {
                if (r >= 0 && r < boardSize && c >= 0 && c < boardSize) {
                    const x = boardPadding + c * cellSize,
                        y = boardPadding + r * cellSize;
                    ctx.beginPath();
                    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            // 提示
            if (hintPosition && !gameOver && !replayMode) {
                const { row, col } = hintPosition;
                if (board[row][col] === 0) {
                    const x = boardPadding + col * cellSize,
                        y = boardPadding + row * cellSize,
                        radius = cellSize * 0.42;
                    ctx.fillStyle = 'rgba(200,180,60,0.2)';
                    ctx.beginPath();
                    ctx.arc(x, y, radius * 0.9, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(200,180,60,0.5)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, radius * 0.9, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = 'rgba(200,180,60,0.25)';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.arc(x, y, radius * 1.2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
            // 棋子
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (board[r][c] === 0) continue;
                    const x = boardPadding + c * cellSize,
                        y = boardPadding + r * cellSize,
                        radius = cellSize * 0.42,
                        isBlack = board[r][c] === 1;
                    ctx.shadowColor = 'rgba(0,0,0,0.12)';
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 3;
                    const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.35, radius * 0.1, x, y, radius);
                    if (isBlack) {
                        grad.addColorStop(0, '#4a4a4a');
                        grad.addColorStop(0.6, '#1a1a1a');
                        grad.addColorStop(1, '#0a0a0a');
                    } else {
                        grad.addColorStop(0, '#ffffff');
                        grad.addColorStop(0.5, '#f8f6f0');
                        grad.addColorStop(1, '#d8d0c0');
                    }
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    if (isBlack) ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    else ctx.strokeStyle = 'rgba(180,170,158,0.4)';
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.arc(x, y, radius - 0.5, 0, Math.PI * 2);
                    ctx.stroke();
                    if (!isBlack) {
                        ctx.fillStyle = 'rgba(255,255,255,0.7)';
                        ctx.beginPath();
                        ctx.arc(x - radius * 0.2, y - radius * 0.25, radius * 0.18, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.25)';
                        ctx.beginPath();
                        ctx.arc(x - radius * 0.1, y - radius * 0.38, radius * 0.08, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = 'rgba(255,255,255,0.12)';
                        ctx.beginPath();
                        ctx.arc(x - radius * 0.15, y - radius * 0.2, radius * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.06)';
                        ctx.beginPath();
                        ctx.arc(x - radius * 0.05, y - radius * 0.32, radius * 0.06, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    const step = stepBoard[r][c];
                    if (step > 0) {
                        ctx.shadowBlur = 0;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        const textColor = isBlack ? '#e8e0d8' : '#4a3e34';
                        const fontSize = Math.max(9, radius * 0.6);
                        ctx.font = `600 ${fontSize}px -apple-system, "Segoe UI", sans-serif`;
                        ctx.shadowColor = isBlack ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.5)';
                        ctx.shadowBlur = 3;
                        ctx.shadowOffsetX = 1;
                        ctx.shadowOffsetY = 1;
                        ctx.fillStyle = textColor;
                        ctx.fillText(step, x, y + 0.5);
                        ctx.shadowBlur = 0;
                        ctx.shadowOffsetX = 0;
                        ctx.shadowOffsetY = 0;
                    }
                }
            }
            if (moveHistory.length > 0 && !replayMode) {
                const last = moveHistory[moveHistory.length - 1];
                const x = boardPadding + last.col * cellSize,
                    y = boardPadding + last.row * cellSize,
                    radius = cellSize * 0.42;
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(200,60,50,0.5)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(x, y, radius * 0.45, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = 'rgba(200,60,50,0.7)';
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        function drawScene() {
            const w = canvasSize,
                h = canvasSize;
            sctx.clearRect(0, 0, w, h);
            sctx.fillStyle = FIXED_BG;
            sctx.fillRect(0, 0, w, h);
        }

        function clearEffects() { ectx.clearRect(0, 0, canvasSize, canvasSize); }

        // ================================================================
        //  音效
        // ================================================================
        function initAudio() { if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)(); }

        function playTone(freq, dur, type = 'sine', vol = 0.12) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator(),
                    gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        function soundPlace() { playTone(580, 0.07);
            setTimeout(() => playTone(780, 0.05), 55); }

        function soundWin() { playTone(523, 0.15);
            setTimeout(() => playTone(659, 0.15), 120);
            setTimeout(() => playTone(784, 0.2), 240);
            setTimeout(() => playTone(1047, 0.25), 380); }

        function soundLose() { playTone(784, 0.15);
            setTimeout(() => playTone(659, 0.15), 120);
            setTimeout(() => playTone(523, 0.2), 240);
            setTimeout(() => playTone(392, 0.25), 380); }

        function soundHint() { playTone(880, 0.08);
            setTimeout(() => playTone(1100, 0.06), 60); }

        // ================================================================
        //  落子动画
        // ================================================================
        function animatePiece(row, col, player) {
            const x = boardPadding + col * cellSize,
                y = boardPadding + row * cellSize,
                radius = cellSize * 0.42;
            let progress = 0,
                start = performance.now();

            function frame(time) {
                const elapsed = time - start;
                progress = Math.min(elapsed / 130, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const scale = 1 + 0.18 * (1 - ease) * (1 + Math.sin(progress * Math.PI * 0.5) * 0.3);
                const r = radius * scale;
                ectx.clearRect(0, 0, canvasSize, canvasSize);
                const isBlack = player === 1;
                const grad = ectx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
                if (isBlack) {
                    grad.addColorStop(0, '#4a4a4a');
                    grad.addColorStop(0.6, '#1a1a1a');
                    grad.addColorStop(1, '#0a0a0a');
                } else {
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.5, '#f8f6f0');
                    grad.addColorStop(1, '#d8d0c0');
                }
                ectx.beginPath();
                ectx.arc(x, y, r, 0, Math.PI * 2);
                ectx.fillStyle = grad;
                ectx.shadowColor = 'rgba(0,0,0,0.15)';
                ectx.shadowBlur = 16;
                ectx.fill();
                ectx.shadowBlur = 0;
                if (progress < 1) requestAnimationFrame(frame);
                else { clearEffects();
                    drawBoard();
                    soundPlace(); }
            }
            requestAnimationFrame(frame);
        }

        // ================================================================
        //  ★★★ 棋力增强核心：精细化评分 ★★★
        // ================================================================
        function evaluatePosition(row, col, player) {
            const dirs = [
                [1, 0],
                [0, 1],
                [1, 1],
                [1, -1]
            ];
            let totalScore = 0;
            let threats = []; // 记录每个方向的威胁等级

            for (const [dr, dc] of dirs) {
                let count = 1;
                let openLeft = 0,
                    openRight = 0;
                // 正方向
                for (let i = 1; i < 5; i++) {
                    const nr = row + dr * i,
                        nc = col + dc * i;
                    if (nr < 0 || nr >= boardSize || nc < 0 || nc >= boardSize) break;
                    if (board[nr][nc] === player) count++;
                    else if (board[nr][nc] === 0) { openRight++; break; } else break;
                }
                // 反方向
                for (let i = 1; i < 5; i++) {
                    const nr = row - dr * i,
                        nc = col - dc * i;
                    if (nr < 0 || nr >= boardSize || nc < 0 || nc >= boardSize) break;
                    if (board[nr][nc] === player) count++;
                    else if (board[nr][nc] === 0) { openLeft++; break; } else break;
                }
                const totalOpen = openLeft + openRight;

                // ---- 精细化棋型评分 ----
                let score = 0;
                let threatLevel = 0; // 0=无, 1=眠二/活二, 2=眠三, 3=活三, 4=冲四, 5=活四, 6=五子

                if (count >= 5) { score = 1000000;
                    threatLevel = 6; } else if (count === 4) {
                    if (totalOpen >= 2) { score = 80000;
                        threatLevel = 5; } // 活四
                    else if (totalOpen === 1) { score = 25000;
                        threatLevel = 4; } // 冲四
                    else { score = 500;
                        threatLevel = 0; }
                } else if (count === 3) {
                    if (totalOpen >= 2) { score = 12000;
                        threatLevel = 3; } // 活三
                    else if (totalOpen === 1) { score = 800;
                        threatLevel = 2; } // 眠三
                    else { score = 50;
                        threatLevel = 0; }
                } else if (count === 2) {
                    if (totalOpen >= 2) { score = 400;
                        threatLevel = 1; } // 活二
                    else if (totalOpen === 1) { score = 40;
                        threatLevel = 1; } // 眠二
                    else { score = 4;
                        threatLevel = 0; }
                } else if (count === 1) {
                    score = 1;
                    threatLevel = 0;
                }

                totalScore += score;
                threats.push(threatLevel);
            }

            // ---- 双威胁检测（双活三 / 活三+冲四 = 必胜） ----
            let liveThrees = threats.filter(t => t === 3).length;
            let fours = threats.filter(t => t >= 4).length;
            // 如果有两个活三 或 一个活三+一个冲四/活四 或 两个冲四
            if (liveThrees >= 2 || (liveThrees >= 1 && fours >= 1) || fours >= 2) {
                totalScore += 50000; // 双杀加成
            }

            // ---- 防守分（对手威胁） ----
            // 注意：这个函数会被调用来评估AI的进攻分和防守分
            // 我们在这里不重复计算对手，而是在 aiMove 中综合攻防

            return totalScore;
        }

        // ================================================================
        //  ★★★ 增强版 AI 决策（攻防平衡 + 紧急防守） ★★★
        // ================================================================
        function aiMove(excludeRow = -1, excludeCol = -1) {
            if (gameOver || currentPlayer !== 2 || gameMode !== 'pve') {
                isAIThinking = false;
                return;
            }

            let empty = [];
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (board[r][c] === 0) {
                        if (r === excludeRow && c === excludeCol) continue;
                        empty.push([r, c]);
                    }
                }
            }
            if (empty.length === 0) { isAIThinking = false; return; }

            // 获取难度系数：简单=0.6, 中等=0.8, 困难=1.0
            const difficultyFactor = aiDifficulty === 'easy' ? 0.6 : aiDifficulty === 'medium' ? 0.85 : 1.0;

            let bestScore = -Infinity;
            let bestMoves = [];

            for (const [r, c] of empty) {
                // ---- 进攻分 ----
                const attackScore = evaluatePosition(r, c, 2);

                // ---- 防守分（模拟对手下在这里） ----
                const defenseScore = evaluatePosition(r, c, 1);

                // ---- 综合评分 ----
                let score = attackScore * 0.9 + defenseScore * 1.1;

                // ---- 紧急防守：如果对手有活三或冲四，防守权重剧增 ----
                // 检测对手在当前位置的威胁级别（从 evaluatePosition 中提取）
                // 我们重新调用一次但只获取威胁级别，为了性能我们直接在 evaluatePosition 中返回威胁信息
                // 这里简单处理：如果防守分 > 20000，说明对手有活四/冲四，必须防守
                if (defenseScore > 20000) {
                    score = defenseScore * 1.8 + attackScore * 0.3;
                } else if (defenseScore > 8000) {
                    // 对手有活三
                    score = defenseScore * 1.5 + attackScore * 0.5;
                } else if (defenseScore > 3000) {
                    // 对手有活二/眠三
                    score = defenseScore * 1.2 + attackScore * 0.8;
                }

                // ---- 中心偏好（随棋盘大小调整） ----
                const center = Math.floor(boardSize / 2);
                const centerDist = Math.abs(r - center) + Math.abs(c - center);
                const maxDist = boardSize - 2;
                const centerBonus = (maxDist - centerDist) * 0.4;
                score += centerBonus;

                // ---- 难度扰动（简单模式加随机，困难模式几乎无随机） ----
                if (aiDifficulty === 'easy') {
                    score += Math.random() * 2000;
                } else if (aiDifficulty === 'medium') {
                    score += Math.random() * 500;
                } else {
                    // 困难模式：加极小随机，保证不总是走同一位置
                    score += Math.random() * 50;
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestMoves = [
                        [r, c]
                    ];
                } else if (Math.abs(score - bestScore) < 0.001) {
                    bestMoves.push([r, c]);
                }
            }

            // ---- 处理特殊情况：如果对手有活三+冲四组合，必须堵住关键点 ----
            // 这里不再额外处理，因为上面的防守分已经覆盖了

            if (bestMoves.length === 0) {
                // 保底
                let fallback = [];
                for (let r = 0; r < boardSize; r++) {
                    for (let c = 0; c < boardSize; c++) {
                        if (board[r][c] === 0) {
                            if (r === excludeRow && c === excludeCol) continue;
                            fallback.push([r, c]);
                        }
                    }
                }
                if (fallback.length === 0) { isAIThinking = false; return; }
                const [r, c] = fallback[0];
                isAIThinking = false;
                placePiece(r, c, true);
                return;
            }

            const move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            const [row, col] = move;
            isAIThinking = false;
            placePiece(row, col, true);
        }

        // ================================================================
        //  核心逻辑 (同前)
        // ================================================================
        function placePiece(row, col, fromAI = false) {
            if (gameOver || replayMode) return false;
            if (row < 0 || row >= boardSize || col < 0 || col >= boardSize) return false;
            if (board[row][col] !== 0) return false;
            if (!fromAI && isAIThinking) return false;
            if (gameMode === 'pve' && currentPlayer === 2 && !aiFirst && !fromAI) return false;

            board[row][col] = currentPlayer;
            moveCount++;
            stepBoard[row][col] = moveCount;
            moveHistory.push({ row, col, player: currentPlayer });
            undoStack.push({ row, col, player: currentPlayer });
            moveCountEl.textContent = '步数 ' + moveCount;
            hintPosition = null;
            animatePiece(row, col, currentPlayer);

            if (checkWin(row, col, currentPlayer)) {
                gameOver = true;
                winner = currentPlayer;
                updateTurnIndicator();
                const isPlayer = !(gameMode === 'pve' && currentPlayer === 2);
                if (isPlayer) {
                    soundWin();
                    showModal('胜利', `恭喜你，${currentPlayer===1?'黑棋':'白棋'}获得胜利！`, 'win');
                } else {
                    soundLose();
                    showModal('失败', `电脑(${currentPlayer===1?'黑棋':'白棋'})获胜，再接再厉！`, 'lose');
                }
                drawBoard();
                return true;
            }
            if (moveCount >= boardSize * boardSize) {
                gameOver = true;
                winner = 0;
                updateTurnIndicator();
                showModal('平局', '棋盘已满，双方不分胜负！', 'win');
                drawBoard();
                return true;
            }
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateTurnIndicator();
            drawBoard();
            if (gameMode === 'pve' && !gameOver && currentPlayer === 2) {
                isAIThinking = true;
                aiTimer = setTimeout(() => { aiMove(); }, 180);
            }
            return true;
        }

        function checkWin(row, col, player) {
            const dirs = [
                [1, 0],
                [0, 1],
                [1, 1],
                [1, -1]
            ];
            for (const [dr, dc] of dirs) {
                let count = 1;
                for (let i = 1; i < 5; i++) {
                    const nr = row + dr * i,
                        nc = col + dc * i;
                    if (nr < 0 || nr >= boardSize || nc < 0 || nc >= boardSize) break;
                    if (board[nr][nc] === player) count++;
                    else break;
                }
                for (let i = 1; i < 5; i++) {
                    const nr = row - dr * i,
                        nc = col - dc * i;
                    if (nr < 0 || nr >= boardSize || nc < 0 || nc >= boardSize) break;
                    if (board[nr][nc] === player) count++;
                    else break;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function updateTurnIndicator() {
            if (gameOver) {
                if (winner === 1) turnIndicator.textContent = '黑胜';
                else if (winner === 2) turnIndicator.textContent = '白胜';
                else turnIndicator.textContent = '平局';
                turnIndicator.className = 'turn-indicator';
                return;
            }
            const isBlack = currentPlayer === 1;
            let role = '';
            if (gameMode === 'pvp') role = isBlack ? '黑' : '白';
            else role = currentPlayer === 1 ? '玩家(黑)' : '电脑(白)';
            turnIndicator.textContent = role + '走';
            turnIndicator.className = 'turn-indicator ' + (isBlack ? 'player-turn' : 'computer-turn');
        }

        // ================================================================
        //  悔棋、提示、复盘等 (同前)
        // ================================================================
        function undoMove() {
            if (replayMode) { exitReplay(); return; }
            if (gameOver && winner !== 0) { gameOver = false;
                winner = 0;
                modalOverlay.classList.remove('show'); }
            if (undoStack.length === 0) return;
            if (isAIThinking) { clearTimeout(aiTimer);
                isAIThinking = false; }
            let stepsToUndo = (gameMode === 'pvp') ? 1 : Math.min(2, undoStack.length);
            let removed = [];
            for (let i = 0; i < stepsToUndo; i++) {
                if (undoStack.length === 0) break;
                const last = undoStack.pop();
                removed.push(last);
                board[last.row][last.col] = 0;
                stepBoard[last.row][last.col] = 0;
                moveHistory.pop();
                moveCount--;
            }
            moveCountEl.textContent = '步数 ' + moveCount;
            if (removed.length > 0) currentPlayer = removed[removed.length - 1].player;
            updateTurnIndicator();
            drawBoard();
            if (gameOver) { gameOver = false;
                winner = 0; }
            if (gameMode === 'pve' && !gameOver && currentPlayer === 2) {
                const aiRemoved = removed.length >= 2 ? removed[removed.length - 2] : null;
                const exRow = aiRemoved ? aiRemoved.row : -1,
                    exCol = aiRemoved ? aiRemoved.col : -1;
                isAIThinking = true;
                aiTimer = setTimeout(() => { aiMove(exRow, exCol); }, 250);
            }
            hintPosition = null;
        }

        function showHint() {
            if (replayMode || gameOver || isAIThinking || (gameMode === 'pve' && currentPlayer === 2)) return;
            let bestScore = -Infinity,
                bestMove = null,
                empty = [];
            for (let r = 0; r < boardSize; r++)
                for (let c = 0; c < boardSize; c++)
                    if (board[r][c] === 0) empty.push([r, c]);
            if (empty.length === 0) return;
            const player = currentPlayer,
                opponent = player === 1 ? 2 : 1;
            for (const [r, c] of empty) {
                let score = evaluatePosition(r, c, player) * 1.3 + evaluatePosition(r, c, opponent) * 1.1;
                const center = Math.floor(boardSize / 2);
                score += ((boardSize - 2 - (Math.abs(r - center) + Math.abs(c - center))) * 0.4);
                if (score > bestScore) { bestScore = score;
                    bestMove = { row: r, col: c }; }
            }
            if (bestMove) {
                hintPosition = bestMove;
                soundHint();
                drawBoard();
                setTimeout(() => {
                    if (hintPosition && hintPosition.row === bestMove.row && hintPosition.col === bestMove.col) {
                        hintPosition = null;
                        drawBoard();
                    }
                }, 4000);
            }
        }

        // ================================================================
        //  复盘 (略)
        // ================================================================
        function enterReplay() {
            if (moveHistory.length === 0) return;
            if (replayMode) return;
            replayMode = true;
            replayHistory = JSON.parse(JSON.stringify(moveHistory));
            replayStep = 0;
            replayControls.style.display = 'flex';
            replayBtn.textContent = '退出复盘';
            board = [];
            stepBoard = [];
            for (let i = 0; i < boardSize; i++) {
                board.push(new Array(boardSize).fill(0));
                stepBoard.push(new Array(boardSize).fill(0));
            }
            hintPosition = null;
            drawBoard();
            updateReplayIndex();
            if (isAIThinking) { clearTimeout(aiTimer);
                isAIThinking = false; }
            gameOver = true;
            modalOverlay.classList.remove('show');
        }

        function exitReplay() {
            replayMode = false;
            replayControls.style.display = 'none';
            replayBtn.textContent = '复盘';
            if (replayAutoTimer) { clearInterval(replayAutoTimer);
                replayAutoTimer = null;
                replayAuto.textContent = '▶'; }
            board = [];
            stepBoard = [];
            for (let i = 0; i < boardSize; i++) {
                board.push(new Array(boardSize).fill(0));
                stepBoard.push(new Array(boardSize).fill(0));
            }
            for (const step of moveHistory) {
                board[step.row][step.col] = step.player;
                stepBoard[step.row][step.col] = moveHistory.indexOf(step) + 1;
            }
            hintPosition = null;
            drawBoard();
            updateTurnIndicator();
            gameOver = false;
            if (winner !== 0 && moveHistory.length > 0) {
                const last = moveHistory[moveHistory.length - 1];
                if (checkWin(last.row, last.col, last.player)) {
                    gameOver = true;
                    winner = last.player;
                    updateTurnIndicator();
                    drawBoard();
                }
            }
        }

        function replayGoTo(step) {
            if (!replayMode) return;
            if (step < 0) step = 0;
            if (step > replayHistory.length) step = replayHistory.length;
            replayStep = step;
            board = [];
            stepBoard = [];
            for (let i = 0; i < boardSize; i++) {
                board.push(new Array(boardSize).fill(0));
                stepBoard.push(new Array(boardSize).fill(0));
            }
            for (let i = 0; i < step; i++) {
                const s = replayHistory[i];
                board[s.row][s.col] = s.player;
                stepBoard[s.row][s.col] = i + 1;
            }
            hintPosition = null;
            drawBoard();
            updateReplayIndex();
        }

        function updateReplayIndex() { replayIndex.textContent = replayStep + '/' + replayHistory.length; }

        function replayPrevStep() { replayGoTo(replayStep - 1); }

        function replayNextStep() { replayGoTo(replayStep + 1); }

        function toggleReplayAuto() {
            if (replayAutoTimer) {
                clearInterval(replayAutoTimer);
                replayAutoTimer = null;
                replayAuto.textContent = '▶';
            } else {
                replayAuto.textContent = '⏸';
                replayAutoTimer = setInterval(() => {
                    if (replayStep < replayHistory.length) replayNextStep();
                    else { clearInterval(replayAutoTimer);
                        replayAutoTimer = null;
                        replayAuto.textContent = '▶'; }
                }, 600);
            }
        }

        function clearReplay() {
            if (replayAutoTimer) { clearInterval(replayAutoTimer);
                replayAutoTimer = null; }
            replayMode = false;
            replayControls.style.display = 'none';
            replayBtn.textContent = '复盘';
            gameOver = false;
        }

        // ================================================================
        //  切换棋盘大小
        // ================================================================
        function changeBoardSize(newSize) {
            boardSize = newSize;
            initSizes();
            initBoard();
            drawScene();
            drawBoard();
            if (gameMode === 'pve' && !gameOver && currentPlayer === 2) {
                isAIThinking = true;
                aiTimer = setTimeout(() => { aiMove(-1, -1); }, 200);
            }
        }

        // ================================================================
        //  渲染
        // ================================================================
        function render() { drawScene();
            clearEffects();
            drawBoard(); }

        // ================================================================
        //  事件绑定
        // ================================================================
        function getBoardCoords(e) {
            const rect = boardCanvas.getBoundingClientRect();
            const scale = canvasSize / rect.width;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            return { x: (clientX - rect.left) * scale, y: (clientY - rect.top) * scale };
        }

        function handleBoardClick(e) {
            if (replayMode || gameOver || isAIThinking || (gameMode === 'pve' && currentPlayer === 2)) return;
            const { x, y } = getBoardCoords(e);
            let minDist = cellSize * 0.5,
                bestR = -1,
                bestC = -1;
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    const px = boardPadding + c * cellSize,
                        py = boardPadding + r * cellSize,
                        dist = Math.hypot(x - px, y - py);
                    if (dist < minDist) { minDist = dist;
                        bestR = r;
                        bestC = c; }
                }
            }
            if (bestR >= 0 && bestC >= 0) {
                if (hintPosition) { hintPosition = null; }
                placePiece(bestR, bestC, false);
            }
        }

        boardCanvas.addEventListener('click', handleBoardClick);
        boardCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            handleBoardClick({ clientX: touch.clientX, clientY: touch.clientY });
        }, { passive: false });

        // 按钮事件
        restartBtn.addEventListener('click', () => {
            if (replayMode) exitReplay();
            if (isAIThinking) { clearTimeout(aiTimer);
                isAIThinking = false; }
            initBoard();
            gameOver = false;
            winner = 0;
            isAIThinking = false;
            hintPosition = null;
            modalOverlay.classList.remove('show');
            if (gameMode === 'pve' && aiFirst) {
                currentPlayer = 2;
                updateTurnIndicator();
                isAIThinking = true;
                aiTimer = setTimeout(() => aiMove(-1, -1), 300);
            } else { currentPlayer = 1;
                updateTurnIndicator(); }
            render();
        });

        menuBtn.addEventListener('click', () => {
            if (replayMode) exitReplay();
            game.classList.add('hidden');
            cover.classList.remove('hidden');
            if (isAIThinking) { clearTimeout(aiTimer);
                isAIThinking = false; }
            hintPosition = null;
            modalOverlay.classList.remove('show');
        });

        undoBtn.addEventListener('click', undoMove);
        hintBtn.addEventListener('click', showHint);
        replayBtn.addEventListener('click', () => { replayMode ? exitReplay() : enterReplay(); });

        boardSizeSelect.addEventListener('change', (e) => {
            const newSize = parseInt(e.target.value);
            if (newSize !== boardSize) {
                if (replayMode) exitReplay();
                if (isAIThinking) { clearTimeout(aiTimer);
                    isAIThinking = false; }
                hintPosition = null;
                changeBoardSize(newSize);
            }
        });

        replayPrev.addEventListener('click', replayPrevStep);
        replayNext.addEventListener('click', replayNextStep);
        replayAuto.addEventListener('click', toggleReplayAuto);
        replayExit.addEventListener('click', exitReplay);

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'z') { e.preventDefault();
                undoMove(); }
            if (e.key === 'h' || e.key === 'H') { e.preventDefault();
                showHint(); }
        });

        modalBtn.addEventListener('click', () => { modalOverlay.classList.remove('show'); });

        // 难度切换
        const gameDifficultySelect = document.getElementById('gameDifficultySelect');
        gameDifficultySelect.addEventListener('change', (e) => { aiDifficulty = e.target.value; });

        // ================================================================
        //  启动
        // ================================================================
        function startGame() {
            cover.classList.add('hidden');
            game.classList.remove('hidden');
            initSizes();
            initBoard();
            render();
            modeLabel.textContent = gameMode === 'pvp' ? '玩家对战' : '人机对战';
            gameDifficultySelect.value = aiDifficulty;
            if (gameMode === 'pve' && aiFirst) {
                currentPlayer = 2;
                updateTurnIndicator();
                isAIThinking = true;
                aiTimer = setTimeout(() => aiMove(-1, -1), 400);
            } else { currentPlayer = 1;
                updateTurnIndicator(); }
            hintPosition = null;
            modalOverlay.classList.remove('show');
        }

        btnPvP.addEventListener('click', () => { gameMode = 'pvp';
            settingsPanel.classList.remove('show');
            startGame(); });
        btnPvE.addEventListener('click', () => { gameMode = 'pve';
            settingsPanel.classList.add('show'); });
        startGameBtn.addEventListener('click', () => {
            aiDifficulty = difficultySelect.value;
            aiFirst = firstSelect.value === 'ai';
            settingsPanel.classList.remove('show');
            startGame();
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (!game.classList.contains('hidden')) { initSizes();
                    render(); }
            }, 150);
        });

        initBoard();
        console.log('五子棋');
    </script>
</body>
</html>
